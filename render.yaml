# Render.com deployment for Gestiva SaaS backend.
# Despliega un nuevo servicio web + una base PostgreSQL en Render.
# Si este archivo está en la raíz del repo, Render lo detecta como blueprint.

services:
  - type: web
    name: gestiva-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start:render
    healthCheckPath: /health
    # Auto-deploy: cada push a la rama conectada despliega solo.
    # Aplica si el servicio está vinculado por Blueprint. Si fue creado a mano,
    # Render ignora este flag y hay que activar Auto-Deploy una vez en el dashboard.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Cobro real vs prueba: se administran en el dashboard de Render.
      # sync:false evita que un re-sync del blueprint los pise (p.ej. apagar el
      # cobro en producción sin querer). Cambialos desde Render, no desde acá.
      - key: MP_TEST_MODE
        sync: false
      - key: SKIP_BILLING
        sync: false
      - key: SUB_PRICE_ARS
        value: "40000"
      - key: GRACE_DAYS
        value: "7"
      - key: DATABASE_URL
        fromDatabase:
          name: gestiva-db
          property: connectionString
      - key: APP_URL
        sync: false   # poner manualmente: https://gestiva.vercel.app o el dominio real
      - key: BACKEND_URL
        sync: false   # poner manualmente: https://gestiva-backend.onrender.com
      - key: MP_ACCESS_TOKEN
        sync: false   # poner manualmente: TEST-xxx (de https://www.mercadopago.com.ar/developers)

databases:
  - name: gestiva-db
    plan: free
    databaseName: gestiva
    user: gestiva
