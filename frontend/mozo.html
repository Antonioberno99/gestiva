<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App Mozos · Gestiva</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --or:#f97316; --or-dk:#ea580c; --or-lt:#fff7ed; --or-100:#ffedd5;
    --tx:#0f172a; --muted:#64748b; --soft:#f8fafc; --border:#e2e8f0;
    --green:#10b981; --green-lt:#d1fae5; --red:#ef4444; --yellow:#f59e0b; --purple:#7c3aed;
    --r:14px; --shadow:0 10px 28px rgba(15,23,42,.10);
    --ff:'Inter',system-ui,sans-serif; --display:'Outfit','Inter',sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:var(--ff); background:var(--soft); color:var(--tx); }
  button,input { font:inherit; }
  button { border:0; cursor:pointer; }
  .screen { min-height:100vh; }
  .login { display:grid; place-items:center; padding:22px; background:linear-gradient(135deg,#fff7ed,#fff); }
  .login-card { width:100%; max-width:430px; background:#fff; border:1px solid var(--border); border-radius:24px; padding:28px; box-shadow:var(--shadow); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .brand-mark { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:#fff; box-shadow:0 10px 24px rgba(15,23,42,.08); overflow:hidden; }
  .brand-mark img { width:40px; height:40px; object-fit:contain; display:block; }
  .brand-name { font-family:var(--display); font-size:22px; font-weight:800; color:var(--or); }
  h1 { font-family:var(--display); font-size:28px; line-height:1.05; margin:0 0 8px; }
  .sub { color:var(--muted); margin:0 0 22px; line-height:1.5; }
  .field { margin-bottom:14px; }
  label { display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  input { width:100%; min-height:46px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; background:#fff; }
  input:focus { outline:3px solid rgba(249,115,22,.18); border-color:var(--or); }
  .btn { min-height:46px; border-radius:12px; padding:12px 16px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary { width:100%; color:#fff; background:linear-gradient(135deg,var(--or),var(--or-dk)); box-shadow:0 8px 18px rgba(249,115,22,.25); }
  .btn-secondary { background:#fff; color:var(--tx); border:1px solid var(--border); }
  .btn-danger { background:#fee2e2; color:#b91c1c; }
  .err { display:none; background:#fee2e2; color:#991b1b; border:1px solid #fecaca; border-radius:12px; padding:11px 12px; margin-bottom:14px; font-size:14px; }
  .err.on { display:block; }
  .demo-box { margin-top:14px; border:1px solid var(--or-100); background:#fff7ed; border-radius:14px; padding:12px; }
  .demo-box strong { display:block; font-size:13px; margin-bottom:4px; }
  .demo-box p { margin:0 0 10px; color:var(--muted); font-size:13px; line-height:1.45; }
  .demo-creds { font-size:12px; color:#9a3412; margin-bottom:10px; }

  .app { display:none; min-height:100vh; }
  .topbar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--border); padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .who { min-width:0; }
  .who strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who span { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .top-actions { display:flex; gap:8px; align-items:center; }
  .content { padding:14px; max-width:980px; margin:0 auto; }
  .toolbar { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; font-size:12px; font-weight:800; }
  .pill.free { background:var(--green-lt); color:#047857; }
  .pill.busy { background:var(--or-100); color:var(--or-dk); }
  .pill.reserved { background:#ede9fe; color:var(--purple); }
  .table-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:10px; }
  .table { background:#fff; border:2px solid var(--border); border-radius:16px; padding:14px; text-align:left; min-height:132px; display:flex; flex-direction:column; gap:7px; }
  .table.busy.mine { border-color:var(--or); background:linear-gradient(135deg,#fff7ed,#fff); }
  .table.busy.other { opacity:.62; }
  .table.reserved { border-color:#c4b5fd; background:linear-gradient(135deg,#f5f3ff,#fff); }
  .table-num { font-family:var(--display); font-size:26px; font-weight:800; }
  .meta { color:var(--muted); font-size:13px; line-height:1.35; }
  .order-head { display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:12px; }
  .order-title { min-width:0; }
  .order-title h2 { font-family:var(--display); margin:0; font-size:24px; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; }
  .tab { white-space:nowrap; padding:8px 12px; border-radius:999px; border:1px solid var(--border); background:#fff; font-weight:700; color:var(--muted); }
  .tab.on { background:var(--or); color:#fff; border-color:var(--or); }
  .product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(138px,1fr)); gap:10px; margin-bottom:16px; }
  .product { min-height:102px; background:#fff; border:1px solid var(--border); border-radius:16px; padding:12px; text-align:left; display:flex; flex-direction:column; gap:5px; }
  .product .pmedia { width:100%; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:var(--soft); display:grid; place-items:center; margin-bottom:6px; }
  .product .pmedia img { width:100%; height:100%; object-fit:cover; display:block; }
  .product .pmedia-fb { width:100%; height:100%; display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:-0.02em; }
  .cat-tone-0 { background:#fef3c7; color:#b45309; }
  .cat-tone-1 { background:#dbeafe; color:#1d4ed8; }
  .cat-tone-2 { background:#fce7f3; color:#be185d; }
  .cat-tone-3 { background:#d1fae5; color:#047857; }
  .cat-tone-4 { background:#ede9fe; color:#6d28d9; }
  .cat-tone-5 { background:#fee2e2; color:#b91c1c; }
  .cat-tone-6 { background:#ccfbf1; color:#0f766e; }
  .product .name { font-weight:800; line-height:1.2; }
  .product .price { color:var(--or-dk); font-weight:800; margin-top:auto; }
  .cart { background:#fff; border:1px solid var(--border); border-radius:18px; overflow:hidden; }
  .cart-title { padding:14px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; font-weight:800; }
  .cart-list { padding:4px 14px; }
  .cart-row { display:grid; grid-template-columns:1fr auto; gap:8px; padding:12px 0; border-bottom:1px solid #f1f5f9; }
  .cart-row:last-child { border-bottom:0; }
  .qty { display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .qty button { width:38px; min-height:36px; background:#fff; font-weight:900; }
  .qty span { min-width:34px; text-align:center; font-weight:800; }
  .cart-actions { padding:14px; border-top:1px solid var(--border); display:flex; gap:10px; }
  .cart-actions .btn { flex:1; }
  .empty { text-align:center; color:var(--muted); padding:32px 16px; }
  .profile-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:12px; }
  .metric { background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; }
  .metric-label { color:var(--muted); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
  .metric-value { font-family:var(--display); font-size:24px; font-weight:800; margin-top:6px; }
  .shift-card { background:#fff; border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:12px; }
  .shift-open { border-color:#86efac; background:linear-gradient(135deg,#ecfdf5,#fff); }
  .shift-row { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid #f1f5f9; font-size:14px; }
  .shift-row:last-child { border-bottom:0; }
  .hidden { display:none !important; }
  @media (max-width:420px) {
    .login-card { padding:22px; }
    .content { padding:10px; }
    .table-grid,.product-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
</style>
</head>
<body>
<section class="screen login" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="brand"><div class="brand-mark"><img src="assets/logo-gestiva-icon.png" alt=""></div><div class="brand-name">Gestiva</div></div>
    <h1>App de mozos</h1>
    <p class="sub">Entrá con el email del restaurante y tu PIN para tomar pedidos desde el celular.</p>
    <div class="err" id="loginErr" aria-live="polite"></div>
    <div class="field">
      <label for="email">Email del restaurante</label>
      <input id="email" name="email" type="email" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="pin">PIN del mozo</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" required autocomplete="current-password" />
    </div>
    <button class="btn btn-primary" id="loginBtn" type="submit">Entrar</button>
    <p style="font-size:12px;margin-top:14px;color:#64748b;text-align:center;">Pedile al encargado el email del restaurante y tu PIN personal.</p>
  </form>
</section>

<section class="app" id="appScreen">
  <header class="topbar">
    <div class="who">
      <strong id="restaurantName">Restaurante</strong>
      <span id="waiterName">Mozo</span>
    </div>
    <div class="top-actions">
      <button class="btn btn-secondary" id="clockBtn" onclick="toggleClock()">Ingresar</button>
      <button class="btn btn-secondary" onclick="showProfile()">Mi panel</button>
      <button class="btn btn-secondary" onclick="logout()">Salir</button>
    </div>
  </header>
  <main class="content">
    <section id="tablesView">
      <div class="toolbar">
        <div>
          <strong>Mesas</strong>
          <div class="meta">Elegí una mesa para abrir o continuar una comanda.</div>
        </div>
        <button class="btn btn-secondary" onclick="loadData()">Actualizar</button>
      </div>
      <div class="table-grid" id="tableGrid"></div>
    </section>

    <section id="orderView" class="hidden">
      <div class="order-head">
        <button class="btn btn-secondary" onclick="showTables()">Volver</button>
        <div class="order-title">
          <h2 id="orderTableTitle">Mesa</h2>
          <div class="meta" id="orderTableMeta"></div>
        </div>
      </div>
      <div class="tabs" id="catTabs"></div>
      <div class="product-grid" id="productGrid"></div>
      <div class="cart">
        <div class="cart-title"><span>Pedido</span><span id="cartTotal">$0</span></div>
        <div class="cart-list" id="cartList"></div>
        <div class="cart-actions">
          <button class="btn btn-danger" onclick="clearCart()">Vaciar</button>
          <button class="btn btn-primary" onclick="saveOrder()">Enviar a cocina</button>
        </div>
      </div>
    </section>

    <section id="profileView" class="hidden">
      <div class="order-head">
        <button class="btn btn-secondary" onclick="showTables()">Mesas</button>
        <div class="order-title">
          <h2>Mi panel</h2>
          <div class="meta" id="profileMeta"></div>
        </div>
      </div>
      <div id="profileContent"></div>
    </section>
  </main>
</section>

<script src="gestiva-config.js"></script>
<script>
let token = localStorage.getItem('gestiva_waiter_token');
let WAITER_DEMO = false; // demo desactivado para producción
let state = { restaurant:null, waiter:null, tables:[], openTables:[], products:[], activeShift:null, recentShifts:[], table:null, items:[], cat:'todos' };

const $ = (s) => document.querySelector(s);
const money = (n) => new Intl.NumberFormat('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 }).format(Number(n||0));
function _hash(s) { let h = 0; for (let i=0;i<s.length;i++) h = (h<<5) - h + s.charCodeAt(i), h |= 0; return Math.abs(h); }
function pVisual(p) {
  if (p && p.photo_url) return `<div class="pmedia"><img src="${p.photo_url}" alt="" loading="lazy"/></div>`;
  const init = (p?.name || '?').slice(0,2).toUpperCase();
  const tone = _hash(p?.cat || p?.name || '') % 7;
  return `<div class="pmedia"><div class="pmedia-fb cat-tone-${tone}">${init}</div></div>`;
}
const hoursBetween = (start, end = new Date()) => Math.max(0, (new Date(end) - new Date(start)) / 36e5);
const fmtHours = (h) => {
  const minutes = Math.round((h || 0) * 60);
  return `${Math.floor(minutes / 60)}h ${String(minutes % 60).padStart(2, '0')}m`;
};

const DEMO_EMAIL = 'demo@gestiva.app';
const DEMO_PIN = '1234';
const DEMO_WAITER_ID = 'demo-waiter-1';

function demoRead(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch(e) { return fallback; }
}

function demoWrite(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function demoId(prefix) {
  return prefix + '-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function waiterDemoSeed() {
  if (!localStorage.getItem('gestiva_demo_products')) {
    demoWrite('gestiva_demo_products', [
      { id:'demo-prod-1', name:'Plato 1', cat:'Comida', price:5000, available:true },
      { id:'demo-prod-2', name:'Plato 2', cat:'Comida', price:7000, available:true },
      { id:'demo-prod-3', name:'Trago 1', cat:'Tragos', price:3500, available:true },
      { id:'demo-prod-4', name:'Bebida 1', cat:'Bebidas', price:1800, available:true }
    ]);
  }
  if (!localStorage.getItem('gestiva_demo_tables')) {
    demoWrite('gestiva_demo_tables', Array.from({ length: 8 }, (_, i) => ({
      id:'demo-table-' + (i + 1), num:i + 1, seats:i < 4 ? 4 : 6, status:'free',
      reservation_name:null, reservation_time:null
    })));
  }
  if (!localStorage.getItem('gestiva_demo_waiters')) {
    demoWrite('gestiva_demo_waiters', [
      { id:DEMO_WAITER_ID, name:'Juan Demo', role:'Mozo', color:'#f97316', hasPin:true, created_at:new Date().toISOString() },
      { id:'demo-waiter-2', name:'Bar Demo', role:'Bartender', color:'#8b5cf6', hasPin:true, created_at:new Date().toISOString() }
    ]);
  }
}

async function waiterDemoApi(path, opts = {}) {
  waiterDemoSeed();
  const method = opts.method || 'GET';
  const body = opts.body ? JSON.parse(opts.body) : {};
  const products = demoRead('gestiva_demo_products', []).filter(p => p.available !== false);
  const tables = demoRead('gestiva_demo_tables', []);
  const waiters = demoRead('gestiva_demo_waiters', []);
  const openTables = demoRead('gestiva_demo_open_tables', []);
  const shifts = demoRead('gestiva_demo_shifts', []);
  const waiter = waiters.find(w => w.id === DEMO_WAITER_ID) || { id:DEMO_WAITER_ID, name:'Juan Demo', role:'Mozo' };

  if (path === '/waiter/login') return { token:'demo-token', waiter };
  if (path === '/waiter/bootstrap') {
    const activeShift = shifts.find(s => s.waiter_id === DEMO_WAITER_ID && !s.ended_at) || null;
    const recentShifts = shifts
      .filter(s => s.waiter_id === DEMO_WAITER_ID)
      .sort((a, b) => new Date(b.started_at) - new Date(a.started_at));
    return {
      restaurant:{ restaurantName:'Restaurante Demo' },
      waiter,
      tables,
      openTables,
      products,
      activeShift,
      recentShifts
    };
  }
  if (path === '/waiter/open-tables' && method === 'POST') {
    let open = openTables.find(x => x.table_id === body.tableId);
    if (!open) {
      open = { table_id:body.tableId, waiter_id:DEMO_WAITER_ID, items:[], opened_at:new Date().toISOString() };
      openTables.push(open);
    }
    demoWrite('gestiva_demo_open_tables', openTables);
    return open;
  }
  if (path.startsWith('/waiter/open-tables/') && method === 'PUT') {
    const tableId = path.split('/').pop();
    let open = openTables.find(x => x.table_id === tableId);
    if (!open) {
      open = { table_id:tableId, waiter_id:DEMO_WAITER_ID, items:[], opened_at:new Date().toISOString() };
      openTables.push(open);
    }
    open.waiter_id = DEMO_WAITER_ID;
    open.items = body.items || [];
    demoWrite('gestiva_demo_open_tables', openTables);
    return open;
  }
  if (path === '/waiter/kitchen' && method === 'POST') {
    const kitchen = demoRead('gestiva_demo_kitchen', []);
    const table = tables.find(t => t.id === body.tableId);
    const ticket = {
      id: demoId('kt'),
      tenant_id: 'demo',
      table_id: body.tableId,
      table_num: table?.num || null,
      waiter_id: DEMO_WAITER_ID,
      waiter_name: waiter.name,
      items: body.items || [],
      notes: body.notes || null,
      status: 'pending',
      created_at: new Date().toISOString()
    };
    kitchen.unshift(ticket);
    demoWrite('gestiva_demo_kitchen', kitchen);
    return ticket;
  }
  if (path === '/waiter/clock' && method === 'POST') {
    const active = shifts.find(s => s.waiter_id === DEMO_WAITER_ID && !s.ended_at);
    if (body.action === 'in') {
      if (!active) shifts.unshift({ id:demoId('shift'), waiter_id:DEMO_WAITER_ID, started_at:new Date().toISOString(), ended_at:null });
    } else if (body.action === 'out') {
      if (!active) throw new Error('shift_not_open');
      active.ended_at = new Date().toISOString();
    }
    demoWrite('gestiva_demo_shifts', shifts);
    return { ok:true };
  }
  throw new Error('demo_not_supported');
}

async function api(path, opts = {}) {
  if (WAITER_DEMO) return waiterDemoApi(path, opts);
  const r = await fetch(window.API_URL + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(opts.headers || {})
    }
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) {
    localStorage.removeItem('gestiva_waiter_token');
    localStorage.removeItem('gestiva_waiter_demo');
    WAITER_DEMO = false;
    showLogin();
    throw new Error('Sesión vencida');
  }
  if (!r.ok) throw new Error(data.error || 'Error');
  return data;
}

function showLogin() {
  $('#loginScreen').style.display = 'grid';
  $('#appScreen').style.display = 'none';
}

function showApp() {
  $('#loginScreen').style.display = 'none';
  $('#appScreen').style.display = 'block';
}

async function enterDemoMode() {
  $('#email').value = DEMO_EMAIL;
  $('#pin').value = DEMO_PIN;
  token = 'demo-token';
  WAITER_DEMO = true;
  localStorage.setItem('gestiva_waiter_token', token);
  localStorage.setItem('gestiva_waiter_demo', '1');
  await loadData();
  showApp();
}

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#loginErr');
  const btn = $('#loginBtn');
  err.classList.remove('on');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  try {
    const email = $('#email').value.trim().toLowerCase();
    const pin = $('#pin').value.trim();
    const data = await api('/waiter/login', {
      method:'POST',
      body: JSON.stringify({ email, pin })
    });
    token = data.token;
    localStorage.setItem('gestiva_waiter_token', token);
    await loadData();
    showApp();
  } catch (e) {
    err.textContent = e.message === 'invalid_credentials' ? 'Email o PIN incorrectos' : e.message;
    err.classList.add('on');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});

async function loadData() {
  const data = await api('/waiter/bootstrap');
  state = { ...state, ...data };
  $('#restaurantName').textContent = data.restaurant.restaurantName;
  $('#waiterName').textContent = `${data.waiter.name} · ${data.waiter.role || 'Mozo'}`;
  $('#clockBtn').textContent = data.activeShift ? 'Marcar salida' : 'Marcar ingreso';
  $('#clockBtn').className = data.activeShift ? 'btn btn-danger' : 'btn btn-secondary';
  renderTables();
}

function renderTables() {
  const openMap = new Map(state.openTables.map(o => [o.table_id, o]));
  $('#tableGrid').innerHTML = state.tables.map(t => {
    const open = openMap.get(t.id);
    const isMine = open && open.waiter_id === state.waiter.id;
    const status = open ? (isMine ? 'busy mine' : 'busy other') : (t.status === 'reserved' ? 'reserved' : 'free');
    const label = open ? (isMine ? 'Tu mesa' : 'Ocupada') : (t.status === 'reserved' ? 'Reservada' : 'Libre');
    const reserved = t.status === 'reserved' && !open ? `<div class="meta">${t.reservation_name || 'Reserva'}${t.reservation_time ? ' · ' + new Date(t.reservation_time).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : ''}</div>` : '';
    return `<button class="table ${status}" onclick="selectTable('${t.id}')">
      <span class="pill ${open ? 'busy' : (t.status === 'reserved' ? 'reserved' : 'free')}">${label}</span>
      <div class="table-num">M${t.num}</div>
      <div class="meta">${t.seats || 4} lugares</div>
      ${reserved}
      ${open ? `<div class="meta">${(open.items||[]).reduce((s,it)=>s+it.qty,0)} productos cargados</div>` : ''}
    </button>`;
  }).join('');
}

async function selectTable(id) {
  const table = state.tables.find(t => t.id === id);
  const open = state.openTables.find(o => o.table_id === id);
  if (open && open.waiter_id !== state.waiter.id) {
    alert('Esta mesa está asignada a otro mozo.');
    return;
  }
  let tableOpen = open;
  if (!tableOpen) {
    tableOpen = await api('/waiter/open-tables', { method:'POST', body: JSON.stringify({ tableId:id }) });
    await loadData();
  }
  state.table = table;
  state.items = structuredClone(tableOpen.items || []);
  state.cat = 'todos';
  $('#tablesView').classList.add('hidden');
  $('#orderView').classList.remove('hidden');
  $('#orderTableTitle').textContent = 'Mesa ' + table.num;
  $('#orderTableMeta').textContent = (table.seats || 4) + ' lugares · ' + state.waiter.name;
  renderOrder();
}

function showTables() {
  $('#profileView').classList.add('hidden');
  $('#orderView').classList.add('hidden');
  $('#tablesView').classList.remove('hidden');
  loadData().catch(console.error);
}

function showProfile() {
  $('#tablesView').classList.add('hidden');
  $('#orderView').classList.add('hidden');
  $('#profileView').classList.remove('hidden');
  renderProfile();
}

function renderProfile() {
  const shifts = state.recentShifts || [];
  const today = new Date().toISOString().slice(0,10);
  const todayShifts = shifts.filter(s => s.started_at.slice(0,10) === today);
  const hoursToday = todayShifts.reduce((sum, s) => sum + hoursBetween(s.started_at, s.ended_at || new Date()), 0);
  const orders = state.openTables.filter(ot => ot.waiter_id === state.waiter?.id).length;
  $('#profileMeta').textContent = `${state.waiter?.name || ''} · ${state.waiter?.role || 'Mozo'}`;
  $('#profileContent').innerHTML = `
    <div class="shift-card ${state.activeShift ? 'shift-open' : ''}">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;">
        <div>
          <div class="metric-label">Estado</div>
          <div style="font-weight:800;font-size:18px;margin-top:4px;">${state.activeShift ? 'Trabajando ahora' : 'Fuera de turno'}</div>
          <div class="meta">${state.activeShift ? 'Ingreso: ' + new Date(state.activeShift.started_at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : 'Marca tu ingreso al llegar al restaurante.'}</div>
        </div>
        <button class="btn ${state.activeShift ? 'btn-danger' : 'btn-primary'}" onclick="toggleClock()">${state.activeShift ? 'Marcar salida' : 'Marcar ingreso'}</button>
      </div>
    </div>
    <div class="profile-grid">
      <div class="metric"><div class="metric-label">Horas hoy</div><div class="metric-value">${fmtHours(hoursToday)}</div></div>
      <div class="metric"><div class="metric-label">Mesas activas</div><div class="metric-value">${orders}</div></div>
      <div class="metric"><div class="metric-label">Rol</div><div class="metric-value">${state.waiter?.role || 'Mozo'}</div></div>
    </div>
    <div class="shift-card">
      <div style="font-weight:800;margin-bottom:8px;">Mis ultimos fichajes</div>
      ${shifts.length === 0 ? '<div class="empty">Sin ingresos registrados.</div>' : shifts.slice(0,10).map(s => `
        <div class="shift-row">
          <div>
            <strong>${new Date(s.started_at).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'})}</strong>
            <div class="meta">${new Date(s.started_at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})} - ${s.ended_at ? new Date(s.ended_at).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}) : 'en curso'}</div>
          </div>
          <strong>${fmtHours(hoursBetween(s.started_at, s.ended_at || new Date()))}</strong>
        </div>`).join('')}
    </div>`;
}

async function toggleClock() {
  try {
    const action = state.activeShift ? 'out' : 'in';
    await api('/waiter/clock', { method:'POST', body: JSON.stringify({ action }) });
    await loadData();
    if (!$('#profileView').classList.contains('hidden')) renderProfile();
    alert(action === 'in' ? 'Ingreso registrado.' : 'Salida registrada.');
  } catch (e) {
    alert(e.message === 'shift_not_open' ? 'No tenes un ingreso abierto.' : e.message);
  }
}

function renderOrder() {
  const cats = ['todos', ...new Set(state.products.map(p => p.cat).filter(Boolean))];
  $('#catTabs').innerHTML = cats.map(c => `<button class="tab ${state.cat===c?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('');
  const filtered = state.products.filter(p => state.cat === 'todos' || p.cat === state.cat);
  $('#productGrid').innerHTML = filtered.map(p => `<button class="product" onclick="addItem('${p.id}')">
    ${pVisual(p)}
    <span class="name">${p.name}</span>
    <span class="price">${money(p.price)}</span>
  </button>`).join('');
  renderCart();
}

function setCat(cat) { state.cat = cat; renderOrder(); }

function addItem(productId) {
  // Buscar existente NO enviado a cocina (los enviados se quedan como están)
  const existing = state.items.find(i => i.productId === productId && !i.sentToKitchen);
  if (existing) existing.qty += 1;
  else state.items.push({ productId, qty:1, sentToKitchen:false });
  renderCart();
}

function changeQty(index, delta) {
  const it = state.items[index];
  // Si el item ya fue enviado a cocina, no se puede cambiar cantidad — solo crear uno nuevo
  if (it.sentToKitchen && delta > 0) {
    alert('Este item ya está en cocina. Agregalo de nuevo desde el menú para una nueva comanda.');
    return;
  }
  if (it.sentToKitchen && delta < 0) {
    if (!confirm('Este item ya fue enviado a cocina. ¿Cancelarlo igual?')) return;
  }
  it.qty += delta;
  if (it.qty <= 0) state.items.splice(index, 1);
  renderCart();
}

function clearCart() {
  if (!state.items.length || confirm('¿Vaciar este pedido?')) {
    state.items = [];
    renderCart();
  }
}

function renderCart() {
  const prodMap = new Map(state.products.map(p => [p.id, p]));
  let total = 0;
  if (!state.items.length) {
    $('#cartList').innerHTML = '<div class="empty">Todavía no cargaste productos.</div>';
    $('#cartTotal').textContent = money(0);
    return;
  }
  $('#cartList').innerHTML = state.items.map((it, i) => {
    const p = prodMap.get(it.productId);
    if (p) total += Number(p.price) * it.qty;
    const sentBadge = it.sentToKitchen
      ? '<span style="font-size:10px;background:var(--green-lt);color:#047857;padding:2px 8px;border-radius:999px;font-weight:700;margin-left:6px;letter-spacing:0.04em;text-transform:uppercase;">en cocina</span>'
      : '<span style="font-size:10px;background:#fff7ed;color:#9a3412;padding:2px 8px;border-radius:999px;font-weight:700;margin-left:6px;letter-spacing:0.04em;text-transform:uppercase;">nuevo</span>';
    return `<div class="cart-row" style="${it.sentToKitchen?'opacity:.8;background:#f8fafc;':''}">
      <div><strong>${p ? p.name : 'Producto'}</strong>${sentBadge}<div class="meta">${p ? money(p.price) : ''}</div></div>
      <div class="qty"><button onclick="changeQty(${i},-1)">−</button><span>${it.qty}</span><button onclick="changeQty(${i},1)" ${it.sentToKitchen?'disabled style="opacity:.4;"':''}>+</button></div>
    </div>`;
  }).join('');
  $('#cartTotal').textContent = money(total);
}

async function saveOrder() {
  if (!state.table) return;
  const newItems = state.items.filter(it => !it.sentToKitchen);
  if (newItems.length === 0) {
    alert('No hay items nuevos para enviar. Todo ya está en cocina.');
    return;
  }
  const prodMap = new Map(state.products.map(p => [p.id, p]));
  // Snapshot de items para cocina (solo nombre, sin emoji)
  const itemsForKitchen = newItems.map(it => {
    const p = prodMap.get(it.productId);
    return {
      name: p?.name || 'Producto',
      qty: it.qty,
      modifiers: it.modifiers || [],
      notes: it.notes || ''
    };
  });
  try {
    // 1) Crear ticket de cocina
    await api('/waiter/kitchen', { method:'POST', body: JSON.stringify({ tableId: state.table.id, items: itemsForKitchen }) });
    // 2) Marcar items como enviados
    state.items = state.items.map(it => ({ ...it, sentToKitchen: true }));
    // 3) Persistir en open_tables
    await api('/waiter/open-tables/' + state.table.id, { method:'PUT', body: JSON.stringify({ items: state.items }) });
    alert('Pedido enviado a cocina (' + newItems.length + ' items)');
    renderCart();
  } catch (e) {
    alert(e.message === 'table_assigned_to_other_waiter' ? 'La mesa está asignada a otro mozo.' : e.message);
  }
}

function logout() {
  localStorage.removeItem('gestiva_waiter_token');
  localStorage.removeItem('gestiva_waiter_demo');
  token = null;
  WAITER_DEMO = false;
  showLogin();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

(async () => {
  if (!token) return showLogin();
  try {
    await loadData();
    showApp();
  } catch (e) {
    showLogin();
  }
})();
</script>
</body>
</html>
