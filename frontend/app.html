<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestiva · App</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --or: #f97316; --or-dk: #ea580c; --or-lt: #fff7ed;
    --or-100: #ffedd5; --or-200: #fed7aa;
    --tx-dark: #0f172a; --tx-mid: #475569; --tx-lt: #94a3b8;
    --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0; --border-soft: #f1f5f9;
    --green: #10b981; --green-lt: #d1fae5;
    --red: #ef4444; --red-lt: #fee2e2;
    --blue: #3b82f6; --blue-lt: #dbeafe;
    --yellow: #f59e0b; --yellow-lt: #fef3c7;
    --purple: #8b5cf6; --purple-lt: #ede9fe;
    --sh-sm: 0 2px 8px rgba(15,23,42,.06);
    --sh-md: 0 8px 24px rgba(15,23,42,.08);
    --sh-lg: 0 20px 48px rgba(15,23,42,.12);
    --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px;
    --ff-display: 'Outfit','Inter',sans-serif;
    --ff-body: 'Inter',-apple-system,sans-serif;
    --ease: cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--ff-body); font-size: 14px; color: var(--tx-dark);
    background: var(--bg); -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .main { max-width: 1600px; margin: 0 auto; width: 100%; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  h1,h2,h3,h4 { font-family: var(--ff-display); margin: 0; letter-spacing: -0.02em; }

  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .sidebar { background:#fff; border-right:1px solid var(--border); padding:20px 16px;
    display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:10px; padding:8px 12px 20px; text-decoration:none; color:inherit; }
  .brand-logo { width:36px; height:36px; border-radius:10px; background:#fff; display:grid; place-items:center; color:white; flex-shrink:0; box-shadow:0 4px 12px rgba(15,23,42,.08); overflow:hidden; }
  .brand-logo img { width:34px; height:34px; object-fit:contain; display:block; }
  .brand-name { font-family:var(--ff-display); font-weight:800; font-size:18px; color:var(--or); }

  .nav-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--r-md); color:var(--tx-mid); font-weight:500; transition:background .15s,color .15s; text-decoration:none; }
  .nav-item:hover { background: var(--bg); color: var(--tx-dark); }
  .nav-item.active { background: var(--or-lt); color: var(--or-dk); font-weight: 600; }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

  .sidebar-footer { margin-top:auto; padding:12px; border-top:1px solid var(--border-soft); display:flex; flex-direction:column; gap:10px; }
  .sub-pill { padding:10px 12px; background:var(--bg); border-radius:var(--r-md); font-size:12px; }
  .sub-pill .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .sub-pill .restaurant { font-weight:700; color:var(--tx-dark); margin-bottom:4px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub-pill .status { display:flex; align-items:center; gap:6px; font-size:11px; }
  .sub-pill .dot { width:7px; height:7px; border-radius:50%; }
  .sub-pill.active .dot { background:var(--green); }
  .sub-pill.grace .dot { background:var(--yellow); }
  .sub-pill.other .dot { background:var(--red); }
  .logout-btn { color:var(--tx-mid); font-size:12px; padding:6px 12px; border-radius:8px; text-align:left; }
  .logout-btn:hover { background:var(--bg); color:var(--red); }

  .cash-pill { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; background:var(--bg); border-radius:var(--r-md); font-size:12px; }
  .cash-pill .dot { width:8px; height:8px; border-radius:50%; }
  .cash-pill.open .dot { background:var(--green); box-shadow:0 0 0 3px rgba(16,185,129,.2); }
  .cash-pill.closed .dot { background:var(--red); box-shadow:0 0 0 3px rgba(239,68,68,.2); }

  .main { padding: 24px 32px; overflow-x: hidden; }
  .page-header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; gap:16px; flex-wrap:wrap; }
  .page-title { font-size: 28px; font-weight: 700; }
  .page-subtitle { color: var(--tx-mid); margin-top: 4px; font-size: 14px; }

  .btn { display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:var(--r-md); font-weight:600; font-size:14px; transition:transform .15s,box-shadow .15s,background .15s; white-space:nowrap; text-decoration:none; }
  .btn svg { width:16px; height:16px; }
  .btn-primary { background:linear-gradient(135deg,var(--or),var(--or-dk)); color:white; box-shadow:0 4px 12px rgba(249,115,22,.3); }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(249,115,22,.4); }
  .btn-secondary { background:white; color:var(--tx-dark); border:1px solid var(--border); }
  .btn-secondary:hover { background:var(--bg); border-color:var(--tx-lt); }
  .btn-danger { background:var(--red); color:white; }
  .btn-danger:hover { background:#dc2626; }
  .btn-ghost { padding:6px 10px; color:var(--tx-mid); border-radius:var(--r-sm); }
  .btn-ghost:hover { background:var(--bg); color:var(--tx-dark); }
  .btn-sm { padding:6px 12px; font-size:13px; }
  .btn-icon { padding:8px; }
  .btn-block { width:100%; justify-content:center; }

  .card { background:var(--panel); border-radius:var(--r-lg); border:1px solid var(--border); padding:20px; }
  .card-title { font-size:13px; color:var(--tx-mid); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px; }
  .card-value { font-size:28px; font-weight:700; font-family:var(--ff-display); letter-spacing:-0.02em; }
  .card-delta { font-size:12px; margin-top:6px; font-weight:600; }
  .card-delta.up { color:var(--green); } .card-delta.down { color:var(--red); } .card-delta.neu { color:var(--tx-lt); }

  .grid { display:grid; gap:16px; }
  .grid-4 { grid-template-columns: repeat(4,1fr); }
  .grid-3 { grid-template-columns: repeat(3,1fr); }
  .grid-2 { grid-template-columns: repeat(2,1fr); }
  @media (max-width:1100px) { .grid-4 { grid-template-columns: repeat(2,1fr); } }
  @media (max-width:700px) { .grid-4,.grid-3,.grid-2 { grid-template-columns: 1fr; } }

  .table-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
  .table-card { border-radius:var(--r-lg); padding:18px 16px; cursor:pointer; transition:transform .15s var(--ease),box-shadow .15s,border-color .15s; border:2px solid var(--border); background:white; position:relative; text-align:left; display:flex; flex-direction:column; gap:6px; min-height:130px; }
  .table-card:hover { transform:translateY(-3px); box-shadow:var(--sh-md); }
  .table-card.libre { border-color:var(--border); }
  .table-card.ocupada { border-color:var(--or); background:linear-gradient(135deg,#fff7ed,#fff); box-shadow:0 4px 16px rgba(249,115,22,.15); }
  .table-card.reservada { border-color:var(--purple); background:linear-gradient(135deg,#f5f3ff,#fff); }
  .table-status { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:3px 8px; border-radius:999px; align-self:flex-start; }
  .table-status.libre { background:var(--green-lt); color:#047857; }
  .table-status.ocupada { background:var(--or-100); color:var(--or-dk); }
  .table-status.reservada { background:#ede9fe; color:#6d28d9; }
  .table-num { font-size:26px; font-weight:800; font-family:var(--ff-display); }
  .table-total { font-size:18px; font-weight:700; color:var(--or-dk); }
  .table-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
  .table-actions .btn-ghost { font-size:12px; padding:5px 8px; border:1px solid var(--border-soft); background:rgba(255,255,255,.85); }
  .table-meta { font-size:12px; color:var(--tx-mid); }

  .list { display:flex; flex-direction:column; }
  .list-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-soft); }
  .list-row:last-child { border-bottom:none; }
  .list-icon { width:36px; height:36px; border-radius:10px; background:var(--or-lt); display:grid; place-items:center; color:var(--or-dk); flex-shrink:0; font-weight:700; font-size:12px; }
  .list-main { flex:1; min-width:0; }
  .list-title { font-weight:600; }
  .list-sub { font-size:12px; color:var(--tx-mid); margin-top:2px; }
  .list-right { text-align:right; font-weight:600; }

  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .field label { font-size:13px; font-weight:600; color:var(--tx-mid); }
  .field input, .field select, .field textarea { padding:10px 12px; border-radius:var(--r-md); border:1px solid var(--border); background:white; transition:border-color .15s,box-shadow .15s; }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--or); box-shadow:0 0 0 3px rgba(249,115,22,.15); }

  .modal-backdrop { position:fixed; inset:0; background:rgba(15,23,42,.5); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px); padding:20px; }
  .modal { background:white; border-radius:var(--r-xl); max-width:540px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--sh-lg); }
  .modal-header { padding:20px 24px; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:center; }
  .modal-title { font-size:20px; font-weight:700; }
  .modal-body { padding:24px; }
  .modal-footer { padding:16px 24px; border-top:1px solid var(--border-soft); display:flex; gap:10px; justify-content:flex-end; }

  .prod-grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .prod-card { background:white; border:1px solid var(--border); border-radius:var(--r-md); padding:12px; cursor:pointer; transition:all .15s; display:flex; flex-direction:column; gap:8px; text-align:left; overflow:hidden; }
  .prod-card:hover { border-color:var(--or); box-shadow:var(--sh-sm); transform:translateY(-2px); }
  .prod-card.unavailable { opacity:.5; cursor:not-allowed; }
  .prod-media { width:100%; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:var(--bg); display:grid; place-items:center; position:relative; }
  .prod-media img { width:100%; height:100%; object-fit:cover; display:block; }
  .prod-media-fallback { width:100%; height:100%; display:grid; place-items:center; font-family:var(--ff-display); font-weight:700; font-size:24px; letter-spacing:-0.02em; }
  .prod-name { font-weight:600; font-size:13px; line-height:1.25; }
  .prod-cat { font-size:10px; color:var(--tx-lt); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }
  .prod-price { font-weight:700; color:var(--or-dk); margin-top:auto; font-size:14px; }
  /* Paleta de fondos por categoría inicial */
  .cat-tone-0 { background:#fef3c7; color:#b45309; }
  .cat-tone-1 { background:#dbeafe; color:#1d4ed8; }
  .cat-tone-2 { background:#fce7f3; color:#be185d; }
  .cat-tone-3 { background:#d1fae5; color:#047857; }
  .cat-tone-4 { background:#ede9fe; color:#6d28d9; }
  .cat-tone-5 { background:#fee2e2; color:#b91c1c; }
  .cat-tone-6 { background:#ccfbf1; color:#0f766e; }

  .cart { display:flex; flex-direction:column; background:white; border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; }
  .cart-header { padding:16px 20px; border-bottom:1px solid var(--border-soft); display:flex; justify-content:space-between; align-items:center; }
  .cart-items { flex:1; max-height:480px; overflow-y:auto; padding:8px 20px; }
  .cart-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-soft); }
  .cart-item:last-child { border-bottom:none; }
  .cart-qty { display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:var(--r-sm); overflow:hidden; }
  .cart-qty button { padding:4px 10px; font-weight:700; color:var(--tx-mid); }
  .cart-qty button:hover { background:var(--bg); color:var(--or-dk); }
  .cart-qty .qty { padding:4px 10px; font-weight:700; min-width:28px; text-align:center; }
  .cart-item-name { flex:1; min-width:0; }
  .cart-item-price { font-weight:600; color:var(--or-dk); white-space:nowrap; }
  .cart-empty { padding:40px 20px; text-align:center; color:var(--tx-lt); }
  .cart-footer { padding:16px 20px; border-top:1px solid var(--border-soft); background:var(--bg); }
  .cart-total { display:flex; justify-content:space-between; margin-bottom:12px; font-size:18px; font-weight:700; }

  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip { padding:7px 14px; border-radius:999px; background:white; border:1px solid var(--border); font-size:13px; font-weight:500; transition:all .15s; }
  .chip:hover { border-color:var(--or); }
  .chip.active { background:var(--or); color:white; border-color:var(--or); }

  .bar-chart { display:flex; flex-direction:column; gap:10px; }
  .bar-row { display:grid; grid-template-columns:140px 1fr auto; gap:12px; align-items:center; font-size:13px; }
  .bar-track { background:var(--bg); border-radius:999px; height:10px; overflow:hidden; }
  .bar-fill { height:100%; background:linear-gradient(90deg,var(--or),var(--or-dk)); border-radius:999px; transition:width .4s var(--ease); }

  .toast-wrap { position:fixed; bottom:24px; right:24px; display:flex; flex-direction:column; gap:10px; z-index:200; }
  .toast { background:var(--tx-dark); color:white; padding:12px 16px; border-radius:var(--r-md); font-size:13px; font-weight:500; box-shadow:var(--sh-md); animation:slidein .3s var(--ease); display:flex; align-items:center; gap:10px; }
  .toast.success { background:var(--green); } .toast.error { background:var(--red); }
  @keyframes slidein { from { transform:translateX(20px); opacity:0; } to { transform:translateX(0); opacity:1; } }

  .empty { padding:60px 20px; text-align:center; color:var(--tx-mid); }
  .empty svg { width:56px; height:56px; color:var(--tx-lt); margin-bottom:12px; }
  .empty h3 { font-size:18px; margin-bottom:6px; }

  .data-table { width:100%; border-collapse:collapse; }
  .data-table th { text-align:left; padding:10px 12px; font-size:12px; color:var(--tx-mid); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; border-bottom:1px solid var(--border); }
  .data-table td { padding:12px; border-bottom:1px solid var(--border-soft); }
  .data-table tr:last-child td { border-bottom:none; }
  .data-table tr:hover td { background:var(--bg); }

  .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
  .badge.green { background:var(--green-lt); color:#047857; }
  .badge.red { background:var(--red-lt); color:#b91c1c; }
  .badge.blue { background:var(--blue-lt); color:#1d4ed8; }
  .badge.yellow { background:var(--yellow-lt); color:#b45309; }
  .badge.gray { background:var(--bg); color:var(--tx-mid); }

  .avatar { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; color:white; font-weight:700; font-size:13px; flex-shrink:0; }

  .grace-banner { background:linear-gradient(135deg,#fef3c7,#fffbeb); border:1px solid #fde68a; color:#b45309; padding:14px 18px; border-radius:12px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .grace-banner b { color:#92400e; }
  .grace-banner a { background:var(--or-dk); color:white; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none; white-space:nowrap; }

  /* Loader */
  .loading { padding:60px 20px; text-align:center; color:var(--tx-mid); }
  .loading-spinner { width:40px; height:40px; border:4px solid var(--bg); border-top-color:var(--or); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position:fixed; left:0; top:0; bottom:0; width:240px; z-index:50; transform:translateX(-100%); transition:transform .25s var(--ease); }
    .sidebar.open { transform:translateX(0); }
    .main { padding:16px; }
    .mobile-menu { display:inline-flex !important; }
  }
  .mobile-menu { display:none; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a href="#/dashboard" class="brand">
      <div class="brand-logo"><img src="assets/logo-gestiva-icon.png" alt=""></div>
      <div class="brand-name">Gestiva</div>
    </a>
    <a href="#/dashboard" class="nav-item" data-route="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Dashboard
    </a>
    <a href="#/mesas" class="nav-item" data-route="mesas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18M5 8v12M19 8v12M9 8V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v3"/></svg>
      Mesas
    </a>
    <a href="#/pedidos" class="nav-item" data-route="pedidos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.5 5M17 13v4a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-4"/></svg>
      Pedidos
      <span id="pedidosBadge" style="margin-left:auto;display:none;background:var(--blue);color:white;font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700;"></span>
    </a>
    <a href="#/productos" class="nav-item" data-route="productos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2H8a2 2 0 0 0-2 2v18l6-3 6 3V4a2 2 0 0 0-2-2z"/></svg>
      Productos
    </a>
    <a href="#/caja" class="nav-item" data-route="caja">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/></svg>
      Caja
    </a>
    <a href="#/mozos" class="nav-item" data-route="mozos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      Equipo
    </a>
    <a href="#/clientes" class="nav-item" data-route="clientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-3-3.87"/><path d="M7 21v-2a4 4 0 0 1 3-3.87"/><circle cx="12" cy="7" r="4"/></svg>
      Clientes
    </a>
    <a href="cocina.html" target="_blank" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><path d="M9 17h6"/></svg>
      Cocina
      <span class="kds-badge" id="kdsBadge" style="margin-left:auto;display:none;background:var(--or);color:white;font-size:11px;padding:2px 7px;border-radius:999px;font-weight:700;"></span>
    </a>
    <a href="#/reportes" class="nav-item" data-route="reportes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 14l4-4 4 4 5-5"/></svg>
      Reportes

<script>
// ============================================================
//                   GASTROPANEL APP (API-backed)
// ============================================================

const TOKEN = localStorage.getItem('gestiva_token');
let USER = JSON.parse(localStorage.getItem('gestiva_user') || 'null');
if (!TOKEN || !USER) location.href = 'login.html';

const $ = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => [...c.querySelectorAll(s)];
const CURRENCY = () => USER?.currency || '$';
const fmt = (n) => CURRENCY() + ' ' + Math.round(n || 0).toLocaleString('es-AR');
// Visual minimalista del producto: foto si existe, sino tile coloreado con inicial.
// Hash simple del nombre o categoría para mantener consistencia de color.
function hashCode(s) { let h = 0; for (let i=0;i<s.length;i++) h = (h<<5) - h + s.charCodeAt(i), h |= 0; return Math.abs(h); }
function productVisual(p, size = 'md') {
  const sizes = { sm: '32px', md: '56px', lg: '100%' };
  const dim = sizes[size];
  if (p && p.photo_url) {
    return `<div class="prod-media" style="${size!=='lg'?'width:'+dim+';height:'+dim+';aspect-ratio:unset;':''}"><img src="${p.photo_url}" alt="" loading="lazy"/></div>`;
  }
  const text = (p?.name || '?').trim();
  const initial = text.slice(0, 2).toUpperCase();
  const tone = hashCode((p?.cat || text)) % 7;
  return `<div class="prod-media" style="${size!=='lg'?'width:'+dim+';height:'+dim+';aspect-ratio:unset;':''}"><div class="prod-media-fallback cat-tone-${tone}">${initial}</div></div>`;
}
const today = () => new Date().toISOString().slice(0,10);
const hoursBetween = (start, end = new Date()) => Math.max(0, (new Date(end) - new Date(start)) / 36e5);
const fmtHours = (h) => {
  const minutes = Math.round((h || 0) * 60);
  return `${Math.floor(minutes / 60)}h ${String(minutes % 60).padStart(2, '0')}m`;
};
const teamAppUrl = () => new URL('/mozo', location.origin).href;
const IS_DEMO = TOKEN === 'gestiva_demo_token';

function demoRead(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch(e) { return fallback; }
}
function demoWrite(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
function demoId(prefix) { return prefix + '-' + Date.now() + '-' + Math.random().toString(16).slice(2); }
function demoSeed() {
  if (!localStorage.getItem('gestiva_demo_products')) {
    demoWrite('gestiva_demo_products', [
      { id:'demo-prod-1', name:'Plato 1', cat:'Comida', price:5000, available:true },
      { id:'demo-prod-2', name:'Plato 2', cat:'Comida', price:7000, available:true },
      { id:'demo-prod-3', name:'Trago 1', cat:'Tragos', price:3500, available:true },
      { id:'demo-prod-4', name:'Bebida 1', cat:'Bebidas', price:1800, available:true },
      { id:'demo-prod-5', name:'Postre 1', cat:'Postres', price:3000, available:true }
    ]);
  }
  if (!localStorage.getItem('gestiva_demo_tables')) {
    demoWrite('gestiva_demo_tables', Array.from({ length: 8 }, (_, i) => ({
      id:'demo-table-' + (i + 1), num:i + 1, seats:i < 4 ? 4 : 6, status:'free',
      reservation_name:null, reservation_time:null
    })));
  }
  if (!localStorage.getItem('gestiva_demo_waiters')) {
    demoWrite('gestiva_demo_waiters', [
      { id:'demo-waiter-1', name:'Juan Demo', role:'Mozo', color:'#f97316', hasPin:true, created_at:new Date().toISOString() },
      { id:'demo-waiter-2', name:'Bar Demo', role:'Bartender', color:'#8b5cf6', hasPin:true, created_at:new Date().toISOString() }
    ]);
  }
}
async function demoApi(path, opts = {}) {
  demoSeed();
  const method = opts.method || 'GET';
  const body = opts.body ? JSON.parse(opts.body) : {};
  const products = demoRead('gestiva_demo_products', []);
  const tables = demoRead('gestiva_demo_tables', []);
  const waiters = demoRead('gestiva_demo_waiters', []);
  const openTables = demoRead('gestiva_demo_open_tables', []);
  const orders = demoRead('gestiva_demo_orders', []);
  const shifts = demoRead('gestiva_demo_shifts', []);
  const cash = demoRead('gestiva_demo_cash', null);
  if (path === '/auth/me') return { user: USER };
  if (path === '/api/products' && method === 'GET') return products;
  if (path === '/api/products' && method === 'POST') { const p = { id:demoId('prod'), available:true, ...body }; products.push(p); demoWrite('gestiva_demo_products', products); return p; }
  if (path.startsWith('/api/products/') && method === 'PUT') { const id = path.split('/').pop(); const p = products.find(x => x.id === id); Object.assign(p, body); demoWrite('gestiva_demo_products', products); return p; }
  if (path.startsWith('/api/products/') && method === 'DELETE') { demoWrite('gestiva_demo_products', products.filter(x => x.id !== path.split('/').pop())); return { ok:true }; }
  if (path === '/api/tables' && method === 'GET') return tables;
  if (path === '/api/tables' && method === 'POST') { const t = { id:demoId('table'), status:'free', reservation_name:null, reservation_time:null, ...body, num:body.num || (tables.length + 1), seats:body.seats || 4 }; tables.push(t); demoWrite('gestiva_demo_tables', tables); return t; }
  if (path.startsWith('/api/tables/') && method === 'PUT') { const id = path.split('/').pop(); const t = tables.find(x => x.id === id); Object.assign(t, { num:body.num ?? t.num, seats:body.seats ?? t.seats, status:body.status ?? t.status, reservation_name:body.reservationName ?? t.reservation_name, reservation_time:body.reservationTime ?? t.reservation_time }); demoWrite('gestiva_demo_tables', tables); return t; }
  if (path.startsWith('/api/tables/') && method === 'DELETE') { demoWrite('gestiva_demo_tables', tables.filter(x => x.id !== path.split('/').pop())); return { ok:true }; }
  if (path === '/api/waiters' && method === 'GET') return waiters;
  if (path === '/api/waiters' && method === 'POST') { const w = { id:demoId('waiter'), role:'Mozo', color:'#f97316', hasPin:!!body.pin, created_at:new Date().toISOString(), ...body }; delete w.pin; waiters.push(w); demoWrite('gestiva_demo_waiters', waiters); return w; }
  if (path.startsWith('/api/waiters/') && method === 'PUT') { const id = path.split('/').pop(); const w = waiters.find(x => x.id === id); Object.assign(w, body, { hasPin:w.hasPin || !!body.pin }); delete w.pin; demoWrite('gestiva_demo_waiters', waiters); return w; }
  if (path.startsWith('/api/waiters/') && method === 'DELETE') { demoWrite('gestiva_demo_waiters', waiters.filter(x => x.id !== path.split('/').pop())); return { ok:true }; }
  if (path.startsWith('/api/staff-shifts')) return shifts.map(s => ({ ...s, waiter_name:(waiters.find(w => w.id === s.waiter_id)?.name || 'Demo'), waiter_role:(waiters.find(w => w.id === s.waiter_id)?.role || 'Mozo'), waiter_color:(waiters.find(w => w.id === s.waiter_id)?.color || '#f97316') }));
  if (path === '/api/open-tables' && method === 'GET') return openTables;
  if (path === '/api/open-tables' && method === 'POST') { let ot = openTables.find(x => x.table_id === body.tableId); if (!ot) { ot = { table_id:body.tableId, waiter_id:body.waiterId, items:[], opened_at:new Date().toISOString() }; openTables.push(ot); } else ot.waiter_id = body.waiterId; demoWrite('gestiva_demo_open_tables', openTables); return ot; }
  if (path.startsWith('/api/open-tables/') && method === 'PUT') { const id = path.split('/').pop(); const ot = openTables.find(x => x.table_id === id); if (body.items) ot.items = body.items; if (body.waiterId) ot.waiter_id = body.waiterId; demoWrite('gestiva_demo_open_tables', openTables); return ot; }
  if (path.startsWith('/api/open-tables/') && method === 'DELETE') { demoWrite('gestiva_demo_open_tables', openTables.filter(x => x.table_id !== path.split('/').pop())); return { ok:true }; }
  if (path.startsWith('/api/orders') && method === 'GET') return orders;
  if (path === '/api/orders' && method === 'POST') { const ot = openTables.find(x => x.table_id === body.tableId); const table = tables.find(t => t.id === body.tableId); const waiter = waiters.find(w => w.id === ot?.waiter_id); const items = (ot?.items || []).map(i => { const p = products.find(pp => pp.id === i.productId); return { ...i, name:p?.name, price:p?.price, emoji:p?.emoji, subtotal:(p?.price || 0) * i.qty }; }); const order = { id:demoId('order'), table_id:body.tableId, table_num:table?.num, waiter_id:waiter?.id, waiter_name:waiter?.name, items, total:items.reduce((s,i)=>s+i.subtotal,0), payment_method:body.paymentMethod, note:body.note, opened_at:ot?.opened_at, closed_at:new Date().toISOString() }; orders.unshift(order); demoWrite('gestiva_demo_orders', orders); demoWrite('gestiva_demo_open_tables', openTables.filter(x => x.table_id !== body.tableId)); return order; }
  if (path === '/api/cash') return { current:cash, history:demoRead('gestiva_demo_cash_history', []) };
  if (path === '/api/cash/open') { const c = { opening_amount:body.openingAmount || 0, transactions:[], opened_at:new Date().toISOString() }; demoWrite('gestiva_demo_cash', c); return c; }
  if (path === '/api/cash/movement') { cash.transactions.push({ id:demoId('tx'), ...body, at:new Date().toISOString() }); demoWrite('gestiva_demo_cash', cash); return { ok:true }; }
  if (path === '/api/cash/close') { demoWrite('gestiva_demo_cash', null); return { ok:true, diff:0, expected:body.closingAmount || 0 }; }
  if (path === '/api/dashboard') { const todayOrders = orders.filter(o => o.closed_at?.slice(0,10) === today()); return { ordersToday:todayOrders, ordersWeek:orders, openCount:openTables.length, tablesCount:tables.length, productsTotal:products.length, productsAvailable:products.filter(p => p.available).length, cash }; }
  if (path === '/api/settings') { USER = { ...USER, restaurantName:body.restaurantName || USER.restaurantName, ownerName:body.ownerName || USER.ownerName, phone:body.phone || USER.phone, currency:body.currency || USER.currency }; localStorage.setItem('gestiva_user', JSON.stringify(USER)); return USER; }
  // Customers
  const customers = demoRead('gestiva_demo_customers', []);
  const custTx = demoRead('gestiva_demo_cust_tx', []);
  if (path === '/api/customers' && method === 'GET') return customers;
  if (path.match(/^\/api\/customers\/[^/]+$/) && method === 'GET') { const id = path.split('/').pop(); const c = customers.find(x => x.id === id); return { customer: c, transactions: custTx.filter(t => t.customer_id === id) }; }
  if (path === '/api/customers' && method === 'POST') { const c = { id: demoId('cust'), balance: 0, created_at: new Date().toISOString(), ...body }; customers.push(c); demoWrite('gestiva_demo_customers', customers); return c; }
  if (path.match(/^\/api\/customers\/[^/]+$/) && method === 'PUT') { const id = path.split('/').pop(); const c = customers.find(x => x.id === id); Object.assign(c, body); demoWrite('gestiva_demo_customers', customers); return c; }
  if (path.match(/^\/api\/customers\/[^/]+$/) && method === 'DELETE') { demoWrite('gestiva_demo_customers', customers.filter(x => x.id !== path.split('/').pop())); return { ok:true }; }
  if (path.match(/^\/api\/customers\/[^/]+\/payment$/)) {
    const id = path.split('/')[3];
    const c = customers.find(x => x.id === id);
    const amt = parseFloat(body.amount);
    c.balance = (parseFloat(c.balance)||0) - amt;
    custTx.unshift({ id: demoId('ctx'), customer_id: id, type:'payment', amount: amt, method: body.method, note: body.note, created_at: new Date().toISOString() });
    demoWrite('gestiva_demo_customers', customers);
    demoWrite('gestiva_demo_cust_tx', custTx);
    // Sumar a caja demo si está abierta y el método no es cuenta_corriente
    const dCash = demoRead('gestiva_demo_cash', null);
    if (dCash && body.method !== 'cuenta_corriente') {
      dCash.transactions = dCash.transactions || [];
      dCash.transactions.push({ id: demoId('tx'), type:'in', amount: amt, method: body.method || 'efectivo',
        desc: 'Pago cuenta: ' + c.name, at: new Date().toISOString() });
      demoWrite('gestiva_demo_cash', dCash);
    }
    return { ok:true };
  }
  // Kitchen
  const kitchen = demoRead('gestiva_demo_kitchen', []);
  if (path === '/api/kitchen' && method === 'GET') return kitchen.filter(k => ['pending','preparing','ready'].includes(k.status));
  if (path === '/api/kitchen' && method === 'POST') { const k = { id: demoId('kt'), tenant_id: 'demo', status:'pending', created_at: new Date().toISOString(), ...body }; kitchen.unshift(k); demoWrite('gestiva_demo_kitchen', kitchen); return k; }
  if (path.match(/^\/api\/kitchen\/[^/]+$/) && method === 'PUT') { const id = path.split('/').pop(); const k = kitchen.find(x => x.id === id); k.status = body.status; if (body.status==='preparing') k.started_at=new Date().toISOString(); if (body.status==='ready') k.ready_at=new Date().toISOString(); if (body.status==='delivered') k.delivered_at=new Date().toISOString(); demoWrite('gestiva_demo_kitchen', kitchen); return k; }
  // Pending orders (delivery/takeaway)
  const pendings = demoRead('gestiva_demo_pending', []);
  if (path === '/api/pending-orders' && method === 'GET') return pendings.filter(p => !['delivered','cancelled'].includes(p.status));
  if (path === '/api/pending-orders' && method === 'POST') { const p = { id: demoId('po'), status:'pending', created_at: new Date().toISOString(), ...body }; pendings.unshift(p); demoWrite('gestiva_demo_pending', pendings); return p; }
  if (path.match(/^\/api\/pending-orders\/[^/]+$/) && method === 'PUT') { const id = path.split('/').pop(); const p = pendings.find(x => x.id === id); Object.assign(p, body); demoWrite('gestiva_demo_pending', pendings); return p; }
  if (path.match(/^\/api\/pending-orders\/[^/]+\/charge$/)) { const id = path.split('/')[3]; const p = pendings.find(x => x.id === id); p.status = 'delivered'; demoWrite('gestiva_demo_pending', pendings); return { ok: true }; }
  // Position update
  if (path.match(/^\/api\/tables\/[^/]+\/position$/)) { const id = path.split('/')[3]; const t = tables.find(x => x.id === id); t.pos_x = body.x; t.pos_y = body.y; demoWrite('gestiva_demo_tables', tables); return t; }
  throw new Error('demo_not_supported');
}

// ---------- API ----------
async function api(path, opts = {}) {
  if (IS_DEMO) return demoApi(path, opts);
  const r = await fetch(window.API_URL + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + TOKEN,
      ...(opts.headers || {})
    }
  });
  const text = await r.text();
  const data = text ? JSON.parse(text) : {};
  if (r.status === 401) { localStorage.clear(); location.href = 'login.html'; throw new Error('unauthorized'); }
  if (r.status === 402) { location.href = 'checkout.html'; throw new Error('subscription_required'); }
  if (!r.ok) throw new Error(data.error || 'api_error');
  return data;
}
const API = {
  me: () => api('/auth/me'),
  products: () => api('/api/products'),
  productCreate: (b) => api('/api/products', { method:'POST', body: JSON.stringify(b) }),
  productUpdate: (id, b) => api('/api/products/'+id, { method:'PUT', body: JSON.stringify(b) }),
  productDelete: (id) => api('/api/products/'+id, { method:'DELETE' }),
  tables: () => api('/api/tables'),
  tableCreate: (b) => api('/api/tables', { method:'POST', body: JSON.stringify(b) }),
  tableUpdate: (id, b) => api('/api/tables/'+id, { method:'PUT', body: JSON.stringify(b) }),
  tableDelete: (id) => api('/api/tables/'+id, { method:'DELETE' }),
  waiters: () => api('/api/waiters'),
  waiterCreate: (b) => api('/api/waiters', { method:'POST', body: JSON.stringify(b) }),
  waiterUpdate: (id, b) => api('/api/waiters/'+id, { method:'PUT', body: JSON.stringify(b) }),
  waiterDelete: (id) => api('/api/waiters/'+id, { method:'DELETE' }),
  staffShifts: (qs = '') => api('/api/staff-shifts' + qs),
  openTables: () => api('/api/open-tables'),
  openTable: (b) => api('/api/open-tables', { method:'POST', body: JSON.stringify(b) }),
  updateOpenTable: (tid, b) => api('/api/open-tables/'+tid, { method:'PUT', body: JSON.stringify(b) }),
  closeOpenTable: (tid) => api('/api/open-tables/'+tid, { method:'DELETE' }),
  createOrder: (b) => api('/api/orders', { method:'POST', body: JSON.stringify(b) }),
  orders: (qs = '') => api('/api/orders' + qs),
  cash: () => api('/api/cash'),
  cashOpen: (b) => api('/api/cash/open', { method:'POST', body: JSON.stringify(b) }),
  cashClose: (b) => api('/api/cash/close', { method:'POST', body: JSON.stringify(b) }),
  cashMovement: (b) => api('/api/cash/movement', { method:'POST', body: JSON.stringify(b) }),
  dashboard: () => api('/api/dashboard'),
  settings: (b) => api('/api/settings', { method:'PUT', body: JSON.stringify(b) }),
  customers: () => api('/api/customers'),
  customer: (id) => api('/api/customers/'+id),
  customerCreate: (b) => api('/api/customers', { method:'POST', body: JSON.stringify(b) }),
  customerUpdate: (id, b) => api('/api/customers/'+id, { method:'PUT', body: JSON.stringify(b) }),
  customerDelete: (id) => api('/api/customers/'+id, { method:'DELETE' }),
  customerPayment: (id, b) => api('/api/customers/'+id+'/payment', { method:'POST', body: JSON.stringify(b) }),
  kitchen: () => api('/api/kitchen'),
  kitchenCreate: (b) => api('/api/kitchen', { method:'POST', body: JSON.stringify(b) }),
  kitchenUpdate: (id, b) => api('/api/kitchen/'+id, { method:'PUT', body: JSON.stringify(b) }),
  pendingOrders: () => api('/api/pending-orders'),
  pendingOrderCreate: (b) => api('/api/pending-orders', { method:'POST', body: JSON.stringify(b) }),
  pendingOrderUpdate: (id, b) => api('/api/pending-orders/'+id, { method:'PUT', body: JSON.stringify(b) }),
  pendingOrderCharge: (id, b) => api('/api/pending-orders/'+id+'/charge', { method:'POST', body: JSON.stringify(b) }),
  tablePosition: (id, x, y) => api('/api/tables/'+id+'/position', { method:'PUT', body: JSON.stringify({x, y}) }),
};

// ---------- Toasts ----------
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  $('#toastWrap').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
}

// ---------- Modal ----------
function openModal(title, bodyHtml, footerHtml = '') {
  $('#modalRoot').innerHTML = `
    <div class="modal-backdrop" id="modalBd">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">${title}</div>
          <button class="btn-ghost btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
      </div>
    </div>`;
  $('#modalBd').addEventListener('click', (e) => { if (e.target.id === 'modalBd') closeModal(); });
}
function closeModal() { $('#modalRoot').innerHTML = ''; }

function logout() {
  if (!confirm('¿Cerrar sesión?')) return;
  localStorage.clear(); location.href = 'login.html';
}
function refreshSubPill() {
  const pill = $('#subPill');
  const status = USER.subscriptionStatus;
  const days = USER.daysLeft;
  const cls = status === 'active' ? 'active' : (status === 'grace' ? 'grace' : 'other');
  pill.className = 'sub-pill ' + cls;
  let label = status === 'active' ? `Activa · ${days || '–'}d`
            : status === 'grace' ? `Período de gracia`
            : status === 'expired' ? 'Vencida'
            : status === 'cancelled' ? 'Cancelada' : 'Pendiente';
  pill.innerHTML = `
    <div class="restaurant">${USER.restaurantName}</div>
    <div class="status"><div class="dot"></div>${label}</div>
  `;
}
function refreshGraceBanner() {
  const el = $('#graceBanner');
  if (USER.subscriptionStatus === 'grace') {
    const days = Math.max(0, Math.ceil((new Date(USER.graceEndsAt) - new Date()) / 86400000));
    el.innerHTML = `<div class="grace-banner">
      <div><b>Tu suscripción venció.</b> Te quedan <b>${days} día${days===1?'':'s'}</b> para renovar antes que se bloquee la cuenta.</div>
      <a href="checkout.html">Renovar ahora</a>
    </div>`;
  } else el.innerHTML = '';
}
let CASH_CACHE = null;
async function refreshCashPill() {
  try {
    if (!CASH_CACHE) {
      const c = await API.cash();
      CASH_CACHE = c.current;
    }
    const pill = $('#cashPill');
    const status = $('#cashStatus');
    const amount = $('#cashAmount');
    if (CASH_CACHE) {
      const txs = CASH_CACHE.transactions || [];
      const total = parseFloat(CASH_CACHE.opening_amount) + txs.reduce((s,t) => s + (t.type === 'in' ? t.amount : -t.amount), 0);
      pill.className = 'cash-pill open';
      status.textContent = 'Abierta';
      amount.textContent = fmt(total);
    } else {
      pill.className = 'cash-pill closed';
      status.textContent = 'Cerrada';
      amount.textContent = '';
    }
  } catch(e) {}
}

function initSalonDrag() {
  const canvas = document.getElementById('salonCanvas');
  if (!canvas) return;
  let dragging = null, offsetX = 0, offsetY = 0, moved = false;
  canvas.querySelectorAll('.salon-table').forEach(el => {
    el.addEventListener('pointerdown', (e) => {
      dragging = el; moved = false;
      const r = el.getBoundingClientRect();
      offsetX = e.clientX - r.left; offsetY = e.clientY - r.top;
      el.setPointerCapture(e.pointerId);
      el.style.zIndex = 100; el.style.boxShadow = '0 12px 32px rgba(0,0,0,.2)';
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging || dragging !== el) return;
      moved = true;
      const rc = canvas.getBoundingClientRect();
      const x = Math.max(0, e.clientX - rc.left - offsetX + canvas.scrollLeft);
      const y = Math.max(0, e.clientY - rc.top - offsetY + canvas.scrollTop);
      el.style.left = x + 'px'; el.style.top = y + 'px';
    });
    el.addEventListener('pointerup', async (e) => {
      if (!dragging || dragging !== el) return;
      el.releasePointerCapture(e.pointerId);
      el.style.zIndex = ''; el.style.boxShadow = '';
      if (moved) {
        const x = parseInt(el.style.left), y = parseInt(el.style.top);
        try { await API.tablePosition(el.dataset.id, x, y); } catch(err) { toast('No se pudo guardar la posición','error'); }
      } else {
        // Click sin arrastrar: abrir la mesa
        location.hash = '#/mesa/' + el.dataset.id;
      }
      dragging = null;
    });
  });
}

// Calcula precio unitario incluyendo modificadores (sin descuento)
function itemUnitPrice(it, prodMap) {
  const p = prodMap.get(it.productId); if (!p) return 0;
  const modSum = (it.modifiers || []).reduce((s,m) => s + (parseFloat(m.price)||0), 0);
  return parseFloat(p.price) + modSum;
}
function itemLineTotal(it, prodMap) {
  return itemUnitPrice(it, prodMap) * it.qty - (it.discount || 0);
}
let CURRENT_DISCOUNT = 0;
let CURRENT_DISCOUNT_TYPE = 'amount'; // 'percent' | 'amount'

  const filtered = CURRENT_PRODUCTS.filter(p => p.available && (CURRENT_CAT==='todos' || p.cat===CURRENT_CAT));
  $('#prodGrid').innerHTML = filtered.map(p => {

      ${productVisual(p, 'lg')}
      <div class="prod-cat">${p.cat}</div>
      <div class="prod-name">${p.name}</div>
      <div class="prod-price">${fmt(p.price)}</div>
      ${p.stock !== null && p.stock !== undefined ? `<div style="font-size:11px;color:${outOfStock?'var(--red)':lowStock?'var(--yellow)':'var(--tx-lt)'};font-weight:600;">${outOfStock?'AGOTADO':'Stock: '+p.stock}</div>` : ''}
    </button>`;
  }).join('');

  const w = CURRENT_WAITERS.find(w => w.id === CURRENT_WAITER_ID);
  const prodMap = new Map(CURRENT_PRODUCTS.map(p => [p.id, p]));
  const subtotal = CURRENT_ITEMS.reduce((s,it) => s + itemLineTotal(it, prodMap), 0);
  const discAmount = CURRENT_DISCOUNT_TYPE === 'percent'
    ? subtotal * (CURRENT_DISCOUNT/100)
    : Math.min(CURRENT_DISCOUNT, subtotal);
  const total = Math.max(0, subtotal - discAmount);

  const pendingItemsToSend = CURRENT_ITEMS.filter(it => !it.sentToKitchen).length;

  $('#cartPane').innerHTML = `

async function persistItems() {

function addItem(pid) {

  if (p.modifiers && p.modifiers.length > 0) {

  const existing = CURRENT_ITEMS.find(i => i.productId === pid && (!i.modifiers || i.modifiers.length === 0) && !i.notes && !i.sentToKitchen);
  if (existing) existing.qty++;

async function cancelOpen() {

async function sendToKitchen() {
  const pending = CURRENT_ITEMS.filter(it => !it.sentToKitchen);
  if (pending.length === 0) return toast('No hay items nuevos','info');
  const prodMap = new Map(CURRENT_PRODUCTS.map(p => [p.id, p]));
  const itemsForKitchen = pending.map(it => {
    const p = prodMap.get(it.productId);
    return { name: p?.name, qty: it.qty, modifiers: it.modifiers||[], notes: it.notes||'' };
  });
  try {
    await API.kitchenCreate({ tableId: CURRENT_TID, items: itemsForKitchen });
    CURRENT_ITEMS.forEach(it => { if (!it.sentToKitchen) it.sentToKitchen = true; });
    persistItems(); renderTableMenu();
    toast('Enviado a cocina','success');
  } catch(e) { toast(e.message,'error'); }
}

  const subtotal = CURRENT_ITEMS.reduce((s,it) => s + itemLineTotal(it, prodMap), 0);
  const discAmount = CURRENT_DISCOUNT_TYPE === 'percent' ? subtotal*(CURRENT_DISCOUNT/100) : Math.min(CURRENT_DISCOUNT, subtotal);
  const total = Math.max(0, subtotal - discAmount);

  let customers = [];
  try { customers = await API.customers(); } catch(e) { /* sin clientes → modal igual abre, cuenta_corriente fallará si la eligen */ }

  openModal('Cobrar Mesa ' + CURRENT_TABLE.num, `
    <div style="text-align:center;margin-bottom:18px;">

      <div style="font-size:36px;font-weight:800;font-family:var(--ff-display);color:var(--or-dk);">${fmt(total)}</div>
      ${CURRENT_DISCOUNT>0 ? `<div style="font-size:12px;color:var(--red);">Desc. ${CURRENT_DISCOUNT_TYPE==='percent'?CURRENT_DISCOUNT+'%':'$'+CURRENT_DISCOUNT}</div>` : ''}

        <select id="payMethod" onchange="updateCustVisibility()">
          <option value="efectivo">Efectivo</option>

          <option value="transferencia">Transferencia</option>

        </select></div>
    </div>

    <div id="paySplit" style="display:none;">
      <p style="font-size:12px;color:var(--tx-mid);margin-bottom:8px;">Dividí el total en varios pagos. La suma tiene que coincidir con ${fmt(total)}.</p>
      <div id="splitRows"></div>
      <button class="btn btn-secondary btn-sm" onclick="addSplitRow()" style="margin-top:8px;">+ Agregar pago</button>

      <select id="custSel">
        <option value="">— Elegir cliente —</option>

      </select>
      <div style="margin-top:6px;"><a onclick="quickAddCustomer()" style="font-size:12px;color:var(--or-dk);cursor:pointer;">+ Crear cliente nuevo</a></div>

    <div class="field" style="margin-top:14px;"><label>Notas (opcional)</label><textarea id="orderNote" rows="2"></textarea></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="confirmCharge(${total})">Confirmar cobro</button>`);
  window.__total = total;
}
function setPayMode(mode) {
  document.getElementById('modeSimple').classList.toggle('active', mode==='simple');
  document.getElementById('modeSplit').classList.toggle('active', mode==='split');
  $('#paySimple').style.display = mode==='simple' ? '' : 'none';
  $('#paySplit').style.display = mode==='split' ? '' : 'none';
  if (mode==='split' && $('#splitRows').children.length === 0) addSplitRow();
  updateCustVisibility();
}
// Muestra el select de cliente cuando se necesita (modo simple con cuenta_corriente,
// o modo split con al menos un split de cuenta_corriente)
function updateCustVisibility() {
  const block = $('#custBlock'); if (!block) return;
  const isSplit = document.getElementById('modeSplit')?.classList.contains('active');
  let needsCust = false;
  if (isSplit) {
    needsCust = [...document.querySelectorAll('.splitMethod')].some(s => s.value === 'cuenta_corriente');
  } else {
    needsCust = $('#payMethod')?.value === 'cuenta_corriente';
  }
  block.style.display = needsCust ? '' : 'none';
}
function addSplitRow() {
  const rows = $('#splitRows');
  const idx = rows.children.length;
  const div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:1.2fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center;';
  div.innerHTML = `
    <select class="splitMethod" onchange="updateCustVisibility()">
      <option value="efectivo">Efectivo</option>
      <option value="tarjeta">Tarjeta</option>
      <option value="transferencia">Transferencia</option>
      <option value="mercadopago">MercadoPago</option>
      <option value="cuenta_corriente">Cuenta corriente</option>
    </select>
    <input class="splitAmount" type="number" min="0" step="100" placeholder="Monto" oninput="updateSplitBalance()"/>
    <button class="btn-ghost btn-icon" onclick="this.parentNode.remove();updateSplitBalance();updateCustVisibility();">✕</button>`;
  rows.appendChild(div);
  updateSplitBalance();
  updateCustVisibility();
}
function updateSplitBalance() {
  const inputs = document.querySelectorAll('.splitAmount');
  const sum = [...inputs].reduce((s,el) => s + (parseFloat(el.value)||0), 0);
  const total = window.__total;
  const diff = total - sum;
  $('#splitBalance').innerHTML = diff === 0
    ? `<span style="color:var(--green);">Coincide con el total</span>`
    : `<span style="color:${diff>0?'var(--red)':'var(--yellow)'};">${diff>0?'Falta':'Excede'}: ${fmt(Math.abs(diff))}</span>`;
}
async function quickAddCustomer() {
  const name = prompt('Nombre del cliente nuevo');
  if (!name) return;
  try {
    const c = await API.customerCreate({ name });
    const sel = $('#custSel');
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name; opt.selected = true;
    sel.appendChild(opt);
    toast('Cliente creado','success');
  } catch(e) { toast(e.message,'error'); }
}
async function confirmCharge(total) {
  const note = $('#orderNote').value;
  const isSplit = document.getElementById('modeSplit').classList.contains('active');
  const payload = {
    tableId: CURRENT_TID,
    note,
    discount: CURRENT_DISCOUNT,
    discountType: CURRENT_DISCOUNT_TYPE
  };
  if (isSplit) {
    const rows = document.querySelectorAll('#splitRows > div');
    const splits = [...rows].map(r => ({
      method: r.querySelector('.splitMethod').value,
      amount: parseFloat(r.querySelector('.splitAmount').value)||0
    })).filter(s => s.amount > 0);
    if (splits.length === 0) return toast('Agregá al menos un pago','error');
    payload.splits = splits;
    // Si hay split de cuenta corriente, necesita cliente
    if (splits.some(s => s.method === 'cuenta_corriente')) {
      // Tomar del select
      const cid = $('#custSel') ? $('#custSel').value : null;
      if (!cid) return toast('Para cuenta corriente, elegí un cliente','error');
      payload.customerId = cid;
    }
  } else {
    payload.paymentMethod = $('#payMethod').value;
    if (payload.paymentMethod === 'cuenta_corriente') {
      const cid = $('#custSel').value;
      if (!cid) return toast('Elegí un cliente','error');
      payload.customerId = cid;
    }
  }
  try {
    await API.createOrder(payload);
    CASH_CACHE = null; CURRENT_DISCOUNT = 0; CURRENT_DISCOUNT_TYPE='amount';
    await refreshCashPill();
    closeModal(); location.hash = '#/mesas'; toast('Cobro registrado','success');
  } catch(e) {
    toast(e.message === 'cash_not_open' ? 'Abrí la caja primero' :
          e.message === 'splits_mismatch' ? 'La suma de pagos no coincide con el total' :
          e.message, 'error');
  }
}

async function renderPedidoDetail(id) {

      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${nextStatus && nextStatus !== 'delivered' ? `<button class="btn btn-secondary" onclick="advancePending('${nextStatus}')">${nextLabel} →</button>` : ''}

function renderPedidoMenu(prodMap) {
  const products = [...prodMap.values()];
  const cats = ['todos', ...new Set(products.map(p => p.cat))];
  $('#pCatChips').innerHTML = cats.map(c => `<button class="chip ${c===window.__pCAT?'active':''}" onclick="window.__pCAT='${c}';renderPedidoMenu(window.__prodMap);">${c}</button>`).join('');
  window.__prodMap = prodMap;
  const filtered = products.filter(p => p.available && (window.__pCAT==='todos' || p.cat===window.__pCAT));
  $('#pProdGrid').innerHTML = filtered.map(p => `
    <button class="prod-card" onclick="addPendingItem('${p.id}')">
      ${productVisual(p, 'lg')}
      <div class="prod-cat">${p.cat}</div>
      <div class="prod-name">${p.name}</div>
      <div class="prod-price">${fmt(p.price)}</div></button>`).join('');

  const items = window.__pendingItems;
  const total = items.reduce((s,it) => {
    const p = prodMap.get(it.productId); if (!p) return s;
    const mods = (it.modifiers||[]).reduce((x,m) => x + (parseFloat(m.price)||0), 0);
    return s + (parseFloat(p.price)+mods)*it.qty;
  }, 0);

  $('#pCart').innerHTML = `
    <div class="cart">
      <div class="cart-header"><div style="font-weight:700;font-size:15px;">Pedido</div></div>
      <div class="cart-items">
        ${items.length===0 ? '<div class="cart-empty">Sin items<br><small>Tocá un producto para agregarlo</small></div>' : items.map((it,i) => {
          const p = prodMap.get(it.productId); if (!p) return '';
          return `<div class="cart-item">
            <div class="cart-qty"><button onclick="changePendingQty(${i},-1)">−</button><span class="qty">${it.qty}</span><button onclick="changePendingQty(${i},1)">+</button></div>
            ${productVisual(p, 'sm')}
            <div class="cart-item-name"><div style="font-weight:600;">${p.name}</div></div>
            <div class="cart-item-price">${fmt(p.price*it.qty)}</div>
            <button class="btn-ghost btn-icon" onclick="window.__pendingItems.splice(${i},1);persistPending();renderPedidoMenu(window.__prodMap);" style="color:var(--red);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            </button>
          </div>`;
        }).join('')}
      </div>
      <div class="cart-footer">
        <div class="cart-total"><span>Total</span><span>${fmt(total)}</span></div>
      </div>
    </div>`;
}
function addPendingItem(pid) {
  const existing = window.__pendingItems.find(i => i.productId === pid);
  if (existing) existing.qty++;
  else window.__pendingItems.push({ productId: pid, qty: 1, modifiers: [], notes: '', discount: 0 });
  persistPending(); renderPedidoMenu(window.__prodMap);
}
function changePendingQty(idx, delta) {
  window.__pendingItems[idx].qty += delta;
  if (window.__pendingItems[idx].qty <= 0) window.__pendingItems.splice(idx, 1);
  persistPending(); renderPedidoMenu(window.__prodMap);
}
async function persistPending() {
  try { await API.pendingOrderUpdate(window.__pendingId, { items: window.__pendingItems }); } catch(e) {}
}
async function advancePending(status) {
  try { await API.pendingOrderUpdate(window.__pendingId, { status }); navigate(); toast('Estado actualizado','success'); }
  catch(e) { toast(e.message, 'error'); }
}
async function newPending(kind) {
  const customers = await API.customers();
  openModal(kind === 'delivery' ? 'Nuevo Delivery' : 'Nuevo Take Away', `
    <div class="grid grid-2" style="gap:12px;">

    ${kind === 'delivery' ? `

async function createPending(kind) {
  const data = {
    kind,
    customerId: $('#poCust').value || null,
    customerName: $('#poName').value.trim(),
    customerPhone: $('#poPhone').value.trim(),
    deliveryAddress: kind === 'delivery' ? $('#poAddr').value.trim() : null,

async function chargePending() {
  const products = await API.products();
  const customers = await API.customers();
  const prodMap = new Map(products.map(p => [p.id, p]));
  const items = window.__pendingItems;
  const subtotal = items.reduce((s,it) => {
    const p = prodMap.get(it.productId); if (!p) return s;
    const mods = (it.modifiers||[]).reduce((x,m) => x + (parseFloat(m.price)||0), 0);
    return s + (parseFloat(p.price)+mods)*it.qty;
  }, 0);
  if (subtotal === 0) return toast('Agregá items primero','error');

  openModal('Cobrar pedido', `
    <div style="text-align:center;margin-bottom:18px;">
      <div style="font-size:13px;color:var(--tx-mid);">Total a cobrar</div>
      <div style="font-size:36px;font-weight:800;font-family:var(--ff-display);color:var(--or-dk);">${fmt(subtotal)}</div>
    </div>
    <div class="field"><label>Método de pago</label>
      <select id="pcMethod" onchange="$('#pcCustBlock').style.display = this.value==='cuenta_corriente'?'':'none';">
        <option value="efectivo">Efectivo</option>
        <option value="tarjeta">Tarjeta</option>
        <option value="transferencia">Transferencia</option>
        <option value="mercadopago">MercadoPago</option>
        <option value="cuenta_corriente">Cuenta corriente</option>
      </select></div>
    <div class="field" id="pcCustBlock" style="display:none;"><label>Cliente</label>
      <select id="pcCust"><option value="">— Elegir —</option>${customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="confirmChargePending()">Confirmar cobro</button>`);
}
async function confirmChargePending() {
  const method = $('#pcMethod').value;
  const customerId = method === 'cuenta_corriente' ? $('#pcCust').value : null;
  if (method === 'cuenta_corriente' && !customerId) return toast('Elegí un cliente','error');
  try {
    await API.pendingOrderCharge(window.__pendingId, { paymentMethod: method, customerId });
    CASH_CACHE = null; await refreshCashPill();
    closeModal(); location.hash = '#/pedidos'; toast('Cobro registrado','success');
  } catch(e) { toast(e.message === 'cash_not_open' ? 'Abrí la caja primero' : e.message, 'error'); }
}

async function saveProduct(id) {
  const stockVal = $('#pStock').value;
  const data = { name: $('#pName').value.trim(), cat: $('#pCat').value.trim() || 'Sin categoría',
    price: parseFloat($('#pPrice').value)||0,

    available: $('#pAvail').value === '1',

}

  const topProds = Object.entries(prodCount).sort((a,b)=>b[1]-a[1]).slice(0,8);

    <div class="grid grid-2" style="margin-bottom:24px;">
      <div class="card">
        <h3 style="margin-bottom:16px;font-size:16px;">Top productos (semana)</h3>
        ${topProds.length===0 ? '<div class="empty">Sin ventas</div>' : `<div class="bar-chart">${topProds.map(([pid,qty]) => {
          const p = prodMap.get(pid); if (!p) return '';
          return `<div class="bar-row"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.name}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(qty/maxProd)*100}%"></div></div>
            <div style="font-weight:700;">${qty}</div></div>`;}).join('')}</div>`}
      </div>
      <div class="card">
        <h3 style="margin-bottom:16px;font-size:16px;">Mozos · ranking ${totalCommissions>0?`<span style="font-size:13px;color:var(--tx-mid);font-weight:500;">· Comisiones: ${fmt(totalCommissions)}</span>`:''}</h3>
        ${waiterStats.length===0 ? '<div class="empty">Sin datos</div>' : `<table class="data-table" style="font-size:13px;">
          <thead><tr><th>Mozo</th><th style="text-align:right;">Órdenes</th><th style="text-align:right;">Ventas</th><th style="text-align:right;">Comisión</th></tr></thead>
          <tbody>${waiterStats.map(w => `<tr>
            <td><div style="display:flex;align-items:center;gap:8px;"><div class="avatar" style="background:${w.color};width:22px;height:22px;font-size:11px;">${w.name[0].toUpperCase()}</div>${w.name}</div></td>
            <td style="text-align:right;">${w.orders}</td>
            <td style="text-align:right;font-weight:700;">${fmt(w.total)}</td>
            <td style="text-align:right;color:var(--green);font-weight:700;">${w.commissionPct>0?fmt(w.commission)+` <span style="font-size:11px;color:var(--tx-mid);">(${w.commissionPct}%)</span>`:'—'}</td>
          </tr>`).join('')}</tbody>
        </table>`}
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:16px;font-size:16px;">Métodos de pago (semana)</h3>
      ${Object.keys(methods).length===0 ? '<div class="empty">Sin cobros</div>' : `<div class="bar-chart">
        ${Object.entries(methods).sort((a,b)=>b[1]-a[1]).map(([m,v]) => `<div class="bar-row">
          <div style="text-transform:capitalize;">${m}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/totalMethods)*100}%"></div></div>
          <div style="font-weight:700;">${fmt(v)} <span style="color:var(--tx-mid);font-weight:500;">(${Math.round(v/totalMethods*100)}%)</span></div></div>`).join('')}</div>`}
    </div>`;
});

// Exportar órdenes a CSV (abre en Excel)
async function exportOrdersCSV() {
  const orders = await API.orders('?limit=500');
  const rows = [
    ['Fecha','Hora','Mesa','Mozo','Subtotal','Descuento','Total','Método','Notas']
  ];
  orders.forEach(o => {
    const d = new Date(o.closed_at);
    rows.push([
      d.toLocaleDateString('es-AR'),
      d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),
      o.table_num ?? '',
      o.waiter_name ?? '',
      o.subtotal ?? o.total,
      o.discount || 0,
      o.total,
      o.payment_method,
      (o.note||'').replace(/[\n\r,;]/g, ' ')
    ]);
  });
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `gestiva-reportes-${today()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Reporte descargado','success');
}

async function saveSettings() {
  try {
    const u = await API.settings({
      restaurantName: $('#setName').value.trim(),
      ownerName: $('#setOwner').value.trim(),
      phone: $('#setPhone').value.trim(),
      currency: $('#setCurrency').value.trim() || '$'
    });
    USER = u; localStorage.setItem('gestiva_user', JSON.stringify(u));
    refreshSubPill(); toast('Cambios guardados','success');
  } catch(e) { toast(e.message,'error'); }
}

// Badge de pedidos pendientes en cocina (sidebar)
async function refreshKdsBadge() {
  try {
    const tickets = await API.kitchen();
    const pending = tickets.filter(t => ['pending','preparing'].includes(t.status)).length;
    const badge = $('#kdsBadge');
    if (badge) {
      if (pending > 0) { badge.textContent = pending; badge.style.display = 'inline-block'; }
      else badge.style.display = 'none';
    }
  } catch(e) {}
}
setInterval(refreshKdsBadge, 20000);
refreshKdsBadge();

// Badge de pedidos pendientes (delivery/takeaway)
async function refreshPedidosBadge() {
  try {
    const pendings = await API.pendingOrders();
    const active = pendings.filter(p => ['pending','preparing','ready','dispatched'].includes(p.status)).length;
    const badge = $('#pedidosBadge');
    if (badge) {
      if (active > 0) { badge.textContent = active; badge.style.display = 'inline-block'; }
      else badge.style.display = 'none';
    }
  } catch(e) {}
}
setInterval(refreshPedidosBadge, 20000);
refreshPedidosBadge();

(async () => {
  try {
    const me = await API.me();
    USER = me.user; localStorage.setItem('gestiva_user', JSON.stringify(USER));
    refreshSubPill();
    refreshGraceBanner();
    if (USER.subscriptionStatus !== 'active' && USER.subscriptionStatus !== 'grace') {
      location.href = 'checkout.html'; return;
    }
    if (!location.hash) location.hash = '#/dashboard';
    navigate();
  } catch (e) {
    console.error(e);
    if (e.message === 'unauthorized') return;
    $('#view').innerHTML = `<div class="empty"><h3>Error de conexión</h3><p>${e.message}</p></div>`;
  }
})();
</script>
