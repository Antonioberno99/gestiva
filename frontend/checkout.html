<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Activar suscripción · Gestiva</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --or:#f97316;--or-dk:#ea580c;--or-lt:#fff7ed;--or-100:#ffedd5;--tx-dark:#0f172a;--tx-mid:#475569;--tx-lt:#94a3b8;--bg:#f8fafc;--border:#e2e8f0;--green:#10b981;--green-lt:#d1fae5;--red:#ef4444;--yellow:#f59e0b;--yellow-lt:#fef3c7;--sh-md:0 12px 40px rgba(15,23,42,.10);--ff-display:'Outfit','Inter',sans-serif;--ff-body:'Inter',sans-serif; }
  *{box-sizing:border-box} body{margin:0;font-family:var(--ff-body);background:linear-gradient(135deg,#fff7ed 0%,#fafafa 50%,#fff7ed 100%);min-height:100vh;color:var(--tx-dark);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden;}
  body::before{content:'';position:absolute;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle, rgba(249,115,22,.12), transparent 70%);border-radius:50%;pointer-events:none;}
  body::after{content:'';position:absolute;bottom:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle, rgba(249,115,22,.08), transparent 70%);border-radius:50%;pointer-events:none;}
  .wrap{max-width:560px;width:100%;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;text-decoration:none;color:inherit;justify-content:center}
  .brand-logo{width:40px;height:40px;overflow:hidden}
  .brand-logo img{width:40px;height:40px;object-fit:contain;display:block}
  .brand-name{font-family:var(--ff-display);font-weight:800;font-size:20px;color:var(--or)}
  .card{background:white;border-radius:24px;padding:36px;box-shadow:var(--sh-md);text-align:center}
  h1{font-family:var(--ff-display);font-size:26px;margin:0 0 8px;letter-spacing:-0.02em}
  .sub{color:var(--tx-mid);margin-bottom:24px;font-size:14px}
  .price-block{background:linear-gradient(135deg,var(--or-lt),#fff);border:1px solid var(--or-100);border-radius:20px;padding:24px;margin-bottom:20px}
  .price{font-family:var(--ff-display);font-size:48px;font-weight:800;color:var(--or-dk);letter-spacing:-0.03em;line-height:1}
  .price-period{color:var(--tx-mid);font-size:14px;margin-top:6px}
  .feat{display:flex;flex-direction:column;gap:10px;text-align:left;margin:20px 0}
  .feat-item{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tx-mid)}
  .feat-item svg{color:var(--green);flex-shrink:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border:none;border-radius:12px;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none}
  .btn-primary{background:linear-gradient(135deg,var(--or),var(--or-dk));color:white;box-shadow:0 6px 16px rgba(249,115,22,.3)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(249,115,22,.4)}
  .btn-test{background:white;color:var(--tx-dark);border:1px dashed var(--border);margin-top:10px;font-size:13px;font-weight:500}
  .btn-test:hover{background:var(--bg)}
  .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
  .info-row:last-child{border-bottom:none}
  .info-row span:last-child{font-weight:600}
  .alert{padding:14px;border-radius:10px;margin-bottom:16px;font-size:13px;text-align:left}
  .alert.warn{background:var(--yellow-lt);color:#b45309;border:1px solid #fde68a}
  .alert.info{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}
  .alert.success{background:var(--green-lt);color:#047857;border:1px solid #6ee7b7}
  .logout{text-align:center;margin-top:18px;font-size:12px;color:var(--tx-lt)}
  .logout a{color:var(--tx-mid);text-decoration:underline;cursor:pointer}
  .mp-logo{background:#00b1ea;color:white;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:0.5px}
  .plan-switch{margin-top:14px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .plan-switch button{background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;color:var(--tx-mid);font-family:inherit;transition:all .15s}
  .plan-switch button:hover{border-color:var(--or);color:var(--or-dk)}
  .plan-switch button.active{background:linear-gradient(135deg,var(--or),var(--or-dk));border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(249,115,22,.3)}
  .plan-label{font-size:13px;font-weight:600;color:var(--tx-mid);margin-bottom:8px;text-align:center}
  .steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px;font-size:12px;color:var(--tx-lt);font-weight:600}
  .steps .st{display:flex;align-items:center;gap:7px}
  .steps .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--border);color:var(--tx-mid);font-size:12px}
  .steps .st.on .num{background:linear-gradient(135deg,var(--or),var(--or-dk));color:#fff}
  .steps .st.done .num{background:var(--or-lt);color:var(--or-dk)}
  .steps .st.on,.steps .st.done{color:var(--tx-dark)}
  .steps .sep{width:18px;height:1px;background:var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <a href="landing.html" class="brand">
    <div class="brand-logo"><img src="assets/logo-gestiva-icon.png" alt=""></div>
    <div class="brand-name">Gestiva</div>
  </a>

  <div class="card" id="card">Cargando...</div>

  <div class="logout">
    <a id="logout">Cerrar sesión</a>
  </div>
</div>

<script src="gestiva-config.js"></script>
<script>
const token = localStorage.getItem('gestiva_token');
let user = JSON.parse(localStorage.getItem('gestiva_user') || 'null');
if (!token || !user) location.href = 'login.html';

const PLANS_INFO = {
  start: { name: 'Start', price: 11000, label: '$11.000' },
  pro:   { name: 'Pro',   price: 20000, label: '$20.000' },
  full:  { name: 'Full',  price: 34000, label: '$34.000' }
};
let currentPlan = user?.plan && PLANS_INFO[user.plan] ? user.plan : 'pro';

document.getElementById('logout').onclick = () => {
  localStorage.removeItem('gestiva_token');
  localStorage.removeItem('gestiva_user');
  location.href = 'landing.html';
};

async function loadStatus() {
  const r = await fetch(window.API_URL + '/billing/status', {
    headers: { Authorization: 'Bearer ' + token }
  });
  if (r.status === 401) { location.href = 'login.html'; return; }
  return r.json();
}

function renderCheckout(status) {
  const s = status?.status || 'pending';
  const card = document.getElementById('card');

  if (s === 'active') {
    card.innerHTML = `
      <div class="alert success">✓ Tu suscripción está activa hasta ${new Date(status.endsAt).toLocaleDateString('es-AR', {day:'numeric',month:'long',year:'numeric'})}</div>
      <h1>¡Listo!</h1>
      <p class="sub">Hola ${user.restaurantName}, ya podés entrar a tu panel.</p>
      <a href="app.html" class="btn btn-primary">Ir al panel →</a>
    `;
    return;
  }

  if (s === 'grace') {
    const daysGrace = Math.max(0, Math.ceil((new Date(status.graceEndsAt) - new Date()) / 86400000));
    card.innerHTML = `
      <div class="alert warn">Tu suscripción venció. Tenés <strong>${daysGrace} día${daysGrace===1?'':'s'}</strong> de gracia para renovar.</div>
      <h1>Renová tu suscripción</h1>
      <p class="sub">Para evitar bloqueo, renová antes de ${new Date(status.graceEndsAt).toLocaleDateString('es-AR')}.</p>
      ${renderPayBlock()}
    `;
    bindPayBtn();
    return;
  }

  if (s === 'expired' || s === 'cancelled') {
    card.innerHTML = `
      <div class="alert warn">Tu suscripción está ${s === 'expired' ? 'vencida' : 'cancelada'}. Reactivala para volver a usar el panel.</div>
      <h1>Reactivar suscripción</h1>
      <p class="sub">Hola ${user.restaurantName}, reactivá tu cuenta para seguir trabajando.</p>
      ${renderPayBlock()}
    `;
    bindPayBtn();
    return;
  }

  // trial = ya dejó la tarjeta y está en el mes gratis
  if (s === 'trial') {
    const trialDays = Math.max(0, Math.ceil((new Date(status.endsAt) - new Date()) / 86400000));
    const chargeDate = new Date(status.endsAt).toLocaleDateString('es-AR', {day:'numeric',month:'long'});
    const planInfo = PLANS_INFO[currentPlan];
    const cancelling = status.cancelAtPeriodEnd;
    card.innerHTML = `
      <div class="alert success">🎉 Estás en tu <strong>mes gratis</strong> con acceso completo. Te quedan <strong>${trialDays} día${trialDays===1?'':'s'}</strong>.</div>
      <h1>¡Todo listo!</h1>
      <p class="sub">Hola <strong>${user.restaurantName}</strong>, ya podés usar Gestiva sin límites.</p>
      <div class="price-block">
        <div class="price" style="font-size:34px;">Gratis hasta el ${chargeDate}</div>
        <div class="price-period">${cancelling
          ? 'Cancelaste la renovación. No se te va a cobrar.'
          : `Después: Plan ${planInfo.name} ${planInfo.label}/mes · se cobra automáticamente`}</div>
      </div>
      <a href="app.html" class="btn btn-primary">Ir al panel →</a>
      ${cancelling ? '' : '<button class="btn btn-test" id="cancelBtn" style="margin-top:10px;">Cancelar suscripción</button>'}
    `;
    bindCancelBtn();
    return;
  }

  // pending = registrado pero todavía sin tarjeta → debe dejarla para empezar el mes gratis
  const planInfo = PLANS_INFO[currentPlan];
  card.innerHTML = `
    <div class="steps">
      <div class="st done"><span class="num">✓</span> Cuenta</div>
      <div class="sep"></div>
      <div class="st done"><span class="num">✓</span> Tu negocio</div>
      <div class="sep"></div>
      <div class="st on"><span class="num">3</span> Plan</div>
    </div>
    <div class="alert info">Dejá tu tarjeta para activar tu <strong>mes gratis</strong>. No se te cobra nada durante los primeros 30 días.</div>
    <h1>Empezá tu mes gratis</h1>
    <p class="sub">Hola <strong>${user.restaurantName}</strong>, elegí tu plan y activá Gestiva. El primer cobro es recién dentro de 30 días y podés cancelar cuando quieras.</p>

    <div class="plan-label">Plan elegido</div>
    <div class="plan-switch">
      ${['start','pro','full'].map(p => `
        <button data-plan="${p}" class="${p===currentPlan?'active':''}">${PLANS_INFO[p].name} · ${PLANS_INFO[p].label}</button>
      `).join('')}
    </div>

    <div class="price-block">
      <div class="price" style="font-size:34px;">30 días gratis</div>
      <div class="price-period">Luego Plan ${planInfo.name} · ${planInfo.label}/mes · Argentina</div>
    </div>

    <div class="feat" id="planFeatures"></div>

    ${renderPayBlock(true)}
  `;
  renderPlanFeatures();
  bindPlanSwitch();
  bindPayBtn();
}

async function bindCancelBtn() {
  const btn = document.getElementById('cancelBtn');
  if (!btn) return;
  btn.onclick = async () => {
    if (!confirm('¿Seguro que querés cancelar? Vas a mantener el acceso hasta que termine el período actual, y no se te cobra más.')) return;
    btn.disabled = true; btn.textContent = 'Cancelando...';
    try {
      const r = await fetch(window.API_URL + '/billing/cancel', {
        method: 'POST', headers: { Authorization: 'Bearer ' + token }
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'No se pudo cancelar');
      if (data.user) { user = data.user; localStorage.setItem('gestiva_user', JSON.stringify(user)); }
      loadStatus().then(renderCheckout);
    } catch (e) {
      alert('Error: ' + e.message);
      btn.disabled = false; btn.textContent = 'Cancelar suscripción';
    }
  };
}

function renderPlanFeatures() {
  const features = {
    start: ['Caja, comandas y descuentos', 'Hasta 5 mesas · 1 admin', 'Productos ilimitados + menú QR', 'Soporte por email'],
    pro:   ['Mesas ilimitadas + plano visual', 'KDS cocina + app mozos PWA', 'Stock, clientes y cuenta corriente', 'Soporte por WhatsApp'],
    full:  ['Todo lo de Pro', 'Delivery + comisiones por mozo', 'Múltiples cajas y turnos', 'Soporte prioritario']
  };
  const el = document.getElementById('planFeatures');
  if (!el) return;
  el.innerHTML = features[currentPlan].map(f => `
    <div class="feat-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 12l2 2 4-4"/></svg> ${f}</div>
  `).join('');
}

function bindPlanSwitch() {
  document.querySelectorAll('.plan-switch button[data-plan]').forEach(btn => {
    btn.onclick = async () => {
      const newPlan = btn.dataset.plan;
      if (newPlan === currentPlan) return;
      btn.disabled = true;
      try {
        const r = await fetch(window.API_URL + '/billing/plan', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ plan: newPlan })
        });
        if (!r.ok) throw new Error('No se pudo cambiar de plan');
        const data = await r.json();
        if (data.user) {
          user = data.user;
          localStorage.setItem('gestiva_user', JSON.stringify(user));
        }
        currentPlan = newPlan;
        loadStatus().then(renderCheckout);
      } catch (e) {
        alert(e.message);
        btn.disabled = false;
      }
    };
  });
}

function renderPayBlock(isPending) {
  return `
    <button class="btn btn-primary" id="payBtn">
      ${isPending ? 'Agregar tarjeta y empezar gratis' : 'Reactivar con'} <span class="mp-logo">MercadoPago</span> →
    </button>
    <p style="font-size:11px;color:var(--tx-lt);margin-top:12px;">
      ${isPending
        ? 'Validamos tu tarjeta con MercadoPago. No se te cobra durante 30 días. Después se cobra automático cada mes y cancelás cuando quieras.'
        : 'Se cobra automáticamente cada mes. Podés cancelar cuando quieras.'}
    </p>
  `;
}

async function bindPayBtn() {
  const payBtn = document.getElementById('payBtn');

  if (payBtn) payBtn.onclick = async () => {
    payBtn.disabled = true; payBtn.textContent = 'Generando link de pago...';
    try {
      const r = await fetch(window.API_URL + '/billing/subscribe', {
        method: 'POST', headers: { Authorization: 'Bearer ' + token }
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Error al generar pago');
      if (data.initPoint) window.location.href = data.initPoint;
      else throw new Error('No se recibió URL de pago');
    } catch (e) {
      alert('Error: ' + e.message);
      payBtn.disabled = false; payBtn.innerHTML = 'Pagar con <span class="mp-logo">MercadoPago</span> →';
    }
  };
}

loadStatus().then(renderCheckout).catch(e => {
  document.getElementById('card').innerHTML = '<div class="alert warn">Error de conexión con el backend. Verificá que esté corriendo.</div>';
});
</script>
</body>
</html>
