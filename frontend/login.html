<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión · Gestiva</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --or:#f97316;--or-dk:#ea580c;--or-lt:#fff7ed;--tx-dark:#0f172a;--tx-mid:#475569;--bg:#f8fafc;--border:#e2e8f0;--sh-md:0 12px 40px rgba(15,23,42,.10);--ff-display:'Outfit','Inter',sans-serif;--ff-body:'Inter',sans-serif; }
  *{box-sizing:border-box} body{margin:0;font-family:var(--ff-body);background:linear-gradient(135deg,#fff7ed 0%,#fafafa 50%,#fff7ed 100%);min-height:100vh;color:var(--tx-dark);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden;}
  body::before{content:'';position:absolute;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle, rgba(249,115,22,.12), transparent 70%);border-radius:50%;pointer-events:none;}
  body::after{content:'';position:absolute;bottom:-200px;left:-200px;width:600px;height:600px;background:radial-gradient(circle, rgba(249,115,22,.08), transparent 70%);border-radius:50%;pointer-events:none;}
  .wrap{max-width:440px;width:100%;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;text-decoration:none;color:inherit;justify-content:center}
  .brand-logo{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center;color:white;box-shadow:0 6px 16px rgba(15,23,42,.08);overflow:hidden}
  .brand-logo img{width:38px;height:38px;object-fit:contain;display:block}
  .brand-name{font-family:var(--ff-display);font-weight:800;font-size:20px;color:var(--or)}
  .card{background:white;border-radius:24px;padding:36px;box-shadow:var(--sh-md)}
  h1{font-family:var(--ff-display);font-size:24px;margin:0 0 8px;letter-spacing:-0.02em;text-align:center}
  .sub{color:var(--tx-mid);margin-bottom:24px;font-size:14px;text-align:center}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--tx-mid);margin-bottom:6px}
  .field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);font-size:14px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
  .field input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(249,115,22,.15)}
  .btn{width:100%;padding:13px 16px;border:none;border-radius:12px;font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--or),var(--or-dk));color:white;box-shadow:0 6px 16px rgba(249,115,22,.3);transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(249,115,22,.4)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .err{background:#fee2e2;color:#b91c1c;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
  .err.on{display:block}
  .demo-box{margin-top:16px;border:1px solid #ffedd5;background:#fff7ed;border-radius:14px;padding:12px}
  .demo-box strong{display:block;font-size:13px;margin-bottom:4px}
  .demo-box p{margin:0 0 10px;color:var(--tx-mid);font-size:13px;line-height:1.45}
  .demo-creds{font-size:12px;color:#9a3412;margin-bottom:10px}
  .btn-demo{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;background:white;color:var(--tx-dark);transition:background .15s,border-color .15s}
  .btn-demo:hover{background:#fafafa;border-color:#fdba74}
  .alt{text-align:center;margin-top:20px;font-size:13px;color:var(--tx-mid)}
  .alt a{color:var(--or-dk);font-weight:600;text-decoration:none}
  .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--tx-mid);font-size:12px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  #gBtn{display:flex;justify-content:center;}
  #gBtn:empty{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <a href="landing.html" class="brand">
    <div class="brand-logo"><img src="assets/logo-gestiva-icon.png" alt=""></div>
    <div class="brand-name">Gestiva</div>
  </a>
  <div class="card">
    <h1>Iniciar sesión</h1>
    <p class="sub">Accedé a tu sistema Gestiva</p>
    <div class="err" id="err"></div>
    <div id="gBtn"></div>
    <div class="divider" id="gDivider" style="display:none;">o con email</div>
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required autofocus autocomplete="email"/>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input id="password" type="password" required autocomplete="current-password"/>
      </div>
      <button class="btn" id="btn" type="submit">Iniciar sesión</button>
    </form>
    <div class="demo-box">
      <strong>Probar sistema demo</strong>
      <p>Entra con datos ficticios para probar el panel central y la app del equipo.</p>
      <div class="demo-creds">Usuario: demo@gestiva.app - Contraseña: 1234</div>
      <button class="btn-demo" type="button" onclick="fillDemoLogin()">Entrar demo</button>
    </div>
    <div class="alt">¿Sos nuevo? <a href="signup.html">Crear cuenta</a></div>
  </div>
</div>
<script src="gestiva-config.js"></script>
<script>
const form = document.getElementById('loginForm');
const errEl = document.getElementById('err');
const btn = document.getElementById('btn');
const DEMO_USER = {
  id: 'demo-tenant',
  email: 'demo@gestiva.app',
  restaurantName: 'Restaurante Demo',
  ownerName: 'Usuario Demo',
  phone: '',
  currency: '$',
  subscriptionStatus: 'active',
  daysLeft: 365
};
function enterDemoPanel() {
  localStorage.setItem('gestiva_token', 'gestiva_demo_token');
  localStorage.setItem('gestiva_user', JSON.stringify(DEMO_USER));
  location.href = 'app.html';
}
function fillDemoLogin() {
  document.getElementById('email').value = 'demo@gestiva.app';
  document.getElementById('password').value = '1234';
  enterDemoPanel();
}
// Google Sign-In: solo renderiza si hay client_id configurado
function initGoogleSignIn() {
  if (!window.GOOGLE_CLIENT_ID || !window.google?.accounts?.id) return;
  window.google.accounts.id.initialize({
    client_id: window.GOOGLE_CLIENT_ID,
    callback: handleGoogleSignIn,
    auto_select: false,
    context: 'signin'
  });
  window.google.accounts.id.renderButton(document.getElementById('gBtn'), {
    type: 'standard', theme: 'outline', size: 'large', text: 'signin_with',
    shape: 'rectangular', logo_alignment: 'center', width: 340
  });
  document.getElementById('gDivider').style.display = '';
}
async function handleGoogleSignIn(response) {
  errEl.classList.remove('on');
  try {
    const r = await fetch(window.API_URL + '/auth/google', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ credential: response.credential })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error === 'google_not_configured' ? 'Google login no está configurado en el backend' : (data.error || 'Error de login'));
    localStorage.setItem('gestiva_token', data.token);
    localStorage.setItem('gestiva_user', JSON.stringify(data.user));
    if (data.isNew) {
      // Usuario nuevo: lo mandamos a Ajustes para que ponga el nombre del restaurante
      location.href = 'app.html#/ajustes';
    } else if (data.user.subscriptionStatus === 'active' || data.user.subscriptionStatus === 'grace') {
      location.href = 'app.html';
    } else {
      location.href = 'checkout.html';
    }
  } catch(e) {
    errEl.textContent = e.message;
    errEl.classList.add('on');
  }
}
// Esperar a que cargue la lib de Google y inicializar (se inicializa cuando responde el script async)
window.addEventListener('load', () => {
  let attempts = 0;
  const t = setInterval(() => {
    attempts++;
    if (window.google?.accounts?.id) { clearInterval(t); initGoogleSignIn(); }
    else if (attempts > 50) clearInterval(t); // ~10s, sin lib disponible
  }, 200);
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.classList.remove('on');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  try {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    if (email === 'demo@gestiva.app' && password === '1234') {
      enterDemoPanel();
      return;
    }
    const r = await fetch(window.API_URL + '/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email,
        password
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error === 'invalid_credentials' ? 'Email o contraseña incorrectos' : (data.error || 'Error'));
    localStorage.setItem('gestiva_token', data.token);
    localStorage.setItem('gestiva_user', JSON.stringify(data.user));
    // si suscripción está activa o en gracia → app; si no → checkout
    if (data.user.subscriptionStatus === 'active' || data.user.subscriptionStatus === 'grace') {
      location.href = 'app.html';
    } else {
      location.href = 'checkout.html';
    }
  } catch (e) {
    errEl.textContent = e.message; errEl.classList.add('on');
    btn.disabled = false; btn.textContent = 'Iniciar sesión';
  }
});
</script>
</body>
</html>
